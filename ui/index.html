<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent</title>
<style>
  :root {
    --bg:      #0b0e14;
    --surface: #11151c;
    --raised:  #161b24;
    --line:    #1e242e;
    --fg:      #d4dae3;
    --dim:     #6e7a8a;
    --faint:   #4a5464;
    --you:     #7aa2f7;
    --tool:    #e0af68;
    --err:     #f7768e;

    --prose: ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei",
             "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --mono:  ui-monospace, SFMono-Regular, Menlo, Consolas,
             "Cascadia Mono", monospace;

    --col: 880px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.7 var(--prose);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }

  /* ---- 顶栏 ---- */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--dim);
  }
  header .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    transition: background .2s;
  }
  header.busy .dot { background: var(--tool); animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  header .name { color: var(--fg); font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }

  /* ---- 日志 ---- */
  #log {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 10px;
    border: 3px solid var(--bg);
  }
  #log::-webkit-scrollbar-thumb:hover { background: #2b3341; }

  .inner { max-width: var(--col); margin: 0 auto; padding: 22px 20px 40px; }

  .turn { margin-bottom: 26px; }
  .turn + .turn { padding-top: 22px; border-top: 1px solid var(--line); }

  /* ---- 你说的话 ---- */
  .you {
    background: var(--raised);
    border-left: 2px solid var(--you);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---- 一次工具调用 + 它的输出,算一个整体 ---- */
  .call { margin-bottom: 14px; }
  .call:last-child { margin-bottom: 0; }

  .tool {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font: 12.5px/1.6 var(--mono);
    margin-bottom: 4px;
  }
  .tool .name {
    color: var(--tool);
    font-weight: 600;
    flex: none;
  }
  .tool .args {
    color: #5c6878;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- 工具输出 ---- */
  details.result {
    border-left: 2px solid var(--line);
    padding-left: 11px;
  }
  details.result > summary {
    list-style: none;
    cursor: pointer;
    font: 12.5px/1.6 var(--mono);
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  details.result > summary::-webkit-details-marker { display: none; }
  details.result > summary::before {
    content: "▸";
    display: inline-block;
    width: 13px;
    color: var(--faint);
  }
  details.result[open] > summary::before { content: "▾"; }
  details.result > summary:hover { color: var(--fg); }
  details.result pre {
    margin: 8px 0 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12.5px/1.65 var(--mono);
    color: var(--dim);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow: auto;
  }

  /* ---- 模型的回复 ---- */
  .reply { margin-top: 18px; }
  .reply p {
    margin: 0 0 10px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .reply p:last-child { margin-bottom: 0; }
  .reply pre.code {
    margin: 0 0 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 12.5px/1.7 var(--mono);
    color: #c8d3e0;
    overflow-x: auto;
  }

  /* ---- 压缩 / 重试之类的旁注 ---- */
  .note {
    font: 12px/1.6 var(--mono);
    color: var(--faint);
    margin: 3px 0 3px 2px;
  }
  .error { color: var(--err); font: 12.5px/1.6 var(--mono); margin: 6px 0; }

  /* ---- 输入 ---- */
  #bar {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #bar .inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 14px 20px 16px;
  }
  #q {
    flex: 1;
    resize: none;
    height: 44px;
    max-height: 200px;
    padding: 11px 14px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13.5px/1.5 var(--prose);
    transition: border-color .15s;
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: none; border-color: #2f3a4d; }
  #q:disabled { opacity: .45; }
  #send {
    flex: none;
    height: 44px;
    padding: 0 20px;
    background: var(--raised);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13.5px var(--prose);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #send:hover:not(:disabled) { background: #1d2430; border-color: #2f3a4d; }
  #send:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>

<header id="head">
  <span class="dot"></span>
  <span class="name">agent</span>
  <span class="spacer"></span>
  <span id="hint">Enter 发送 · Shift+Enter 换行</span>
</header>

<div id="log"><div class="inner" id="stream"></div></div>

<form id="bar">
  <div class="inner">
    <textarea id="q" rows="1" placeholder="问点什么…" autofocus></textarea>
    <button id="send" type="submit">发送</button>
  </div>
</form>

<script>
const stream = document.getElementById("stream");
const log = document.getElementById("log");
const head = document.getElementById("head");
const form = document.getElementById("bar");
const box = document.getElementById("q");
const send = document.getElementById("send");

let turn = null;

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 只有本来就贴着底才自动滚。正往上翻着看历史的时候,新内容不该把你拽走。
function follow() {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  if (near) log.scrollTop = log.scrollHeight;
}

function add(node, target) {
  (target || turn || stream).appendChild(node);
  follow();
}

function renderReply(text) {
  // 只处理围栏代码块,不引 markdown 库:回复里最常出现的就是它,
  // 不处理的话满屏反引号。别的语法(粗体、列表)原样留着,至少不难看。
  const wrap = el("div", "reply");
  const fence = /```[^\n]*\n([\s\S]*?)```/g;
  let last = 0, m;
  while ((m = fence.exec(text)) !== null) {
    const before = text.slice(last, m.index).trim();
    if (before) wrap.appendChild(el("p", null, before));
    wrap.appendChild(el("pre", "code", m[1].replace(/\n+$/, "")));
    last = fence.lastIndex;
  }
  const rest = text.slice(last).trim();
  if (rest) wrap.appendChild(el("p", null, rest));
  if (!wrap.childNodes.length) wrap.appendChild(el("p", null, text));
  return wrap;
}

// 一次调用和它的输出要贴在一起 —— 事件是分两条来的,靠这个把结果接回
// 上一次调用底下。否则一屏工具的时候,根本看不出哪段输出属于哪次调用。
let call = null;

function render(ev) {
  if (ev.kind === "tool_call") {
    call = el("div", "call");
    const row = el("div", "tool");
    row.appendChild(el("span", "name", ev.name));
    row.appendChild(el("span", "args", JSON.stringify(ev.input)));
    call.appendChild(row);
    add(call);

  } else if (ev.kind === "tool_result") {
    const head = ev.output.trim().split("\n").slice(0, 2).join(" / ").slice(0, 140);
    const d = document.createElement("details");
    d.className = "result";
    d.appendChild(el("summary", null, head || "(没有输出)"));
    d.appendChild(el("pre", null, ev.output));
    add(d, call);
    call = null;

  } else if (ev.kind === "note") {
    add(el("div", "note", ("[" + ev.source + "] " + ev.text).trimEnd()));

  } else if (ev.kind === "reply") {
    add(renderReply(ev.text));

  } else {
    // 认不出来的也显示,别默默吞掉 —— 将来加了新 kind,页面上至少
    // 看得出来,而不是凭空少一段。
    add(el("div", "note", JSON.stringify(ev)));
  }
}

function setBusy(busy) {
  head.classList.toggle("busy", busy);
  document.getElementById("hint").textContent =
    busy ? "运行中…" : "Enter 发送 · Shift+Enter 换行";
  box.disabled = busy;
  send.disabled = busy;
  if (!busy) box.focus();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = box.value.trim();
  if (!query) return;

  turn = el("section", "turn");
  stream.appendChild(turn);
  add(el("div", "you", query));
  box.value = "";
  setBusy(true);

  let res;
  try {
    res = await fetch("/ask", { method: "POST", body: query });
  } catch (err) {
    add(el("div", "error", "连不上后端: " + err));
    setBusy(false);
    return;
  }

  if (!res.ok) {
    add(el("div", "error", "后端返回 " + res.status +
        (res.status === 409 ? "(上一轮还在跑)" : "")));
    setBusy(false);
    return;
  }

  // 逐块读,不 await res.text() —— 那样要等整轮跑完才拿到内容,
  // 就没有"看着它干活"这回事了。
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";

  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // 最后一段可能只到一半,留在 buf 里等下一块 —— 直接切会把一行
      // JSON 拦腰截断,JSON.parse 就炸了。
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (line.trim()) render(JSON.parse(line));
      }
    }
    if (buf.trim()) render(JSON.parse(buf));
  } catch (err) {
    add(el("div", "error", "流断了: " + err));
  }

  setBusy(false);
});

box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// 输入框跟着内容长高,最多到 CSS 里那个 max-height
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 200) + "px";
});
</script>

</body>
</html>
