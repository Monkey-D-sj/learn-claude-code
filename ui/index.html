<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent</title>
<style>
  :root {
    --bg:      #0b0e14;
    --surface: #11151c;
    --raised:  #161b24;
    --line:    #1e242e;
    --fg:      #d4dae3;
    --dim:     #6e7a8a;
    --faint:   #4a5464;
    --you:     #7aa2f7;
    --tool:    #e0af68;
    --err:     #f7768e;

    --prose: ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei",
             "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --mono:  ui-monospace, SFMono-Regular, Menlo, Consolas,
             "Cascadia Mono", monospace;

    --col: 880px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.7 var(--prose);
    -webkit-font-smoothing: antialiased;
    display: flex;              /* 横向:会话栏 + 正文 */
  }

  /* ---- 会话栏 ---- */
  #side {
    flex: none;
    width: 216px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  #new {
    flex: none;
    margin: 10px 10px 6px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--raised);
    color: var(--fg);
    font: 12.5px var(--prose);
    text-align: left;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #new:hover { background: #1d2430; border-color: #2f3a4d; }
  #list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 8px; border: 2px solid var(--surface);
  }

  .row { display: flex; align-items: center; gap: 2px; }
  .sess {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    font: 12.5px/1.45 var(--prose);
    text-align: left;
    cursor: pointer;
  }
  .sess:hover { background: var(--raised); color: var(--fg); }
  .sess[aria-current="true"] { background: var(--raised); color: var(--fg); }
  .sess .t {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sess .when { flex: none; color: var(--faint); font-size: 11px; }
  /* 在跑 / 在等你确认。跟顶栏那个点同一套语汇。 */
  .sess .dot {
    flex: none;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--tool);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .sess .dot.wait { background: var(--you); animation: none; }
  .kill {
    flex: none;
    padding: 0 4px;
    border: 0;
    background: transparent;
    color: var(--faint);
    font: 13px var(--mono);
    cursor: pointer;
    visibility: hidden;
  }
  .row:hover .kill { visibility: visible; }
  .kill:hover { color: var(--err); }

  /* ---- 正文 ---- */
  #main {
    flex: 1;
    min-width: 0;     /* 少了它,flex 子项会被内容撑破,--col 那个居中内层会溢出 */
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 700px) {
    #side { width: 150px; }
  }

  /* ---- 顶栏 ---- */
  header {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--dim);
  }
  header .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    transition: background .2s;
  }
  header.busy .dot { background: var(--tool); animation: pulse 1.1s ease-in-out infinite; }
  header.waiting .dot { background: var(--you); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  header .name { color: var(--fg); font-weight: 600; letter-spacing: .2px; }
  header .spacer { flex: 1; }

  /* ---- 日志 ---- */
  #log {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 10px;
    border: 3px solid var(--bg);
  }
  #log::-webkit-scrollbar-thumb:hover { background: #2b3341; }

  .inner { max-width: var(--col); margin: 0 auto; padding: 22px 20px 40px; }

  .turn { margin-bottom: 26px; }
  .turn + .turn { padding-top: 22px; border-top: 1px solid var(--line); }

  /* ---- 你说的话 ---- */
  .you {
    background: var(--raised);
    border-left: 2px solid var(--you);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---- 一次工具调用 + 它的输出,算一个整体 ---- */
  .call { margin-bottom: 14px; }
  .call:last-child { margin-bottom: 0; }

  .tool {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font: 12.5px/1.6 var(--mono);
    margin-bottom: 4px;
  }
  .tool .name {
    color: var(--tool);
    font-weight: 600;
    flex: none;
  }
  .tool .args {
    color: #5c6878;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- 工具输出 ---- */
  details.result {
    border-left: 2px solid var(--line);
    padding-left: 11px;
  }
  details.result > summary {
    list-style: none;
    cursor: pointer;
    font: 12.5px/1.6 var(--mono);
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  details.result > summary::-webkit-details-marker { display: none; }
  details.result > summary::before {
    content: "▸";
    display: inline-block;
    width: 13px;
    color: var(--faint);
  }
  details.result[open] > summary::before { content: "▾"; }
  details.result > summary:hover { color: var(--fg); }
  details.result pre {
    margin: 8px 0 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12.5px/1.65 var(--mono);
    color: var(--dim);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow: auto;
  }

  /* ---- 推理过程 ----
     跟工具输出同一套折叠结构(点标题展开),但压得更暗、加斜体:它是
     "过程",不该跟模型的结论抢注意力。默认收起也是同一个道理。 */
  details.think { margin-bottom: 10px; }
  details.think > summary {
    list-style: none;
    cursor: pointer;
    font: 12.5px/1.6 var(--mono);
    font-style: italic;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before {
    content: "▸";
    display: inline-block;
    width: 13px;
    font-style: normal;
  }
  details.think[open] > summary::before { content: "▾"; }
  details.think > summary:hover { color: var(--dim); }
  details.think > pre {
    margin: 8px 0 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12.5px/1.65 var(--mono);
    color: var(--faint);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow: auto;
  }

  /* ---- 模型的回复 ----
     段落不再用 white-space: pre-wrap —— 换行现在由解析器发成 <br>,
     两个一起上会变成双倍行距。 */
  .reply { margin-top: 18px; }
  .reply p {
    margin: 0 0 10px;
    word-break: break-word;
  }
  .reply p:last-child { margin-bottom: 0; }
  .reply pre.code {
    margin: 0 0 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 12.5px/1.7 var(--mono);
    color: #c8d3e0;
    overflow-x: auto;
  }

  /* 标题压小:聊天里 h1 那种体量会把上下文挤没,但层级还得看得出来 */
  .reply h1, .reply h2, .reply h3,
  .reply h4, .reply h5, .reply h6 {
    margin: 18px 0 8px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    color: #e6ebf2;
  }
  .reply h1, .reply h2 { font-size: 15px; }
  .reply > :first-child { margin-top: 0; }

  .reply ul, .reply ol { margin: 0 0 10px; padding-left: 22px; }
  .reply li { margin: 3px 0; }
  .reply li > ul, .reply li > ol { margin: 3px 0 0; }

  .reply blockquote {
    margin: 0 0 10px;
    padding: 2px 0 2px 12px;
    border-left: 2px solid var(--line);
    color: var(--dim);
  }

  .reply hr {
    margin: 16px 0;
    border: 0;
    border-top: 1px solid var(--line);
  }

  .reply a {
    color: var(--you);
    text-decoration: none;
    border-bottom: 1px solid #2b3a55;
  }
  .reply a:hover { border-bottom-color: var(--you); }

  .reply code.ic {
    padding: 1px 5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: 12.5px/1.5 var(--mono);
    color: #c8d3e0;
  }
  /* ---- 表格 ----
     外面那层 .tw 是可横向滚动的壳:宽表不该把整个页面撑出一条横向滚动条。 */
  .reply .tw { overflow-x: auto; margin: 0 0 12px; }
  .reply table {
    border-collapse: collapse;
    font-size: 13px;
  }
  .reply th, .reply td {
    border: 1px solid var(--line);
    padding: 6px 11px;
    vertical-align: top;
    word-break: break-word;
  }
  .reply th {
    background: var(--surface);
    color: #e6ebf2;
    font-weight: 600;
    white-space: nowrap;
  }

  .reply strong { color: #e6ebf2; font-weight: 600; }
  .reply em { color: #c8d3e0; }

  /* ---- 压缩 / 重试之类的旁注 ---- */
  .note {
    font: 12px/1.6 var(--mono);
    color: var(--faint);
    margin: 3px 0 3px 2px;
  }
  .error { color: var(--err); font: 12.5px/1.6 var(--mono); margin: 6px 0; }

  /* ---- 权限确认 ----
     不在 #bar 里,所以 setComposer 禁输入框的时候它照样可点 —— agent 那头
     正挂在这条确认上,按不动就等于整轮卡死。 */
  .ask {
    border: 1px solid #3a2f1a;
    background: #17130c;
    border-radius: 8px;
    padding: 11px 13px;
    margin: 10px 0;
  }
  .ask .q {
    font: 12.5px/1.65 var(--mono);
    color: var(--tool);
    word-break: break-word;
  }
  .ask .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .ask button {
    flex: none;
    padding: 5px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--raised);
    color: var(--fg);
    font: 12.5px var(--prose);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .ask button.yes:hover:not(:disabled) { border-color: #3f6b3f; color: #a8d5a8; }
  .ask button.no:hover:not(:disabled)  { border-color: #6b3f3f; color: #f0a0a8; }
  .ask button:disabled { opacity: .4; cursor: default; }
  .ask.done .q { color: var(--faint); }
  .ask .settled { font: 12px/1.6 var(--mono); color: var(--faint); }

  /* ---- 输入 ---- */
  #bar {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #bar .inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 14px 20px 16px;
  }
  #q {
    flex: 1;
    resize: none;
    height: 44px;
    max-height: 200px;
    padding: 11px 14px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13.5px/1.5 var(--prose);
    transition: border-color .15s;
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: none; border-color: #2f3a4d; }
  #q:disabled { opacity: .45; }
  #send {
    flex: none;
    height: 44px;
    padding: 0 20px;
    background: var(--raised);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13.5px var(--prose);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #send:hover:not(:disabled) { background: #1d2430; border-color: #2f3a4d; }
  #send:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>

<aside id="side">
  <button id="new" type="button">＋ 新会话</button>
  <div id="list"></div>
</aside>

<main id="main">

<header id="head">
  <span class="dot"></span>
  <span class="name">agent</span>
  <span class="spacer"></span>
  <span id="hint">Enter 发送 · Shift+Enter 换行</span>
</header>

<div id="log"><div class="inner" id="stream"></div></div>

<form id="bar">
  <div class="inner">
    <textarea id="q" rows="1" placeholder="问点什么…" autofocus></textarea>
    <button id="send" type="submit">发送</button>
  </div>
</form>

</main>

<script>
// 后端在哪儿。页面由后端自己发出来的时候(8765)走相对路径就行;从别处打开
// —— 比如 IDE 的内置预览服务(63342)—— 相对路径会打到那个服务上,那边
// 没有 /ask,于是 404。所以按端口判断一下,不是后端发的就显式指过来。
//
// 改后端端口的话,server.py 的 PORT 和这行要一起改。
const BACKEND = "http://127.0.0.1:8765";
const API = location.port === "8765" ? "" : BACKEND;

const stream = document.getElementById("stream");
const log = document.getElementById("log");
const head = document.getElementById("head");
const form = document.getElementById("bar");
const box = document.getElementById("q");
const send = document.getElementById("send");
const hint = document.getElementById("hint");
const list = document.getElementById("list");
const newBtn = document.getElementById("new");

let turn = null;

// ---- 会话状态 ----
let SESSIONS = [];       // 侧栏那份列表(服务端给的)
let current = null;      // 屏幕上是哪个会话
let lastSeq = 0;         // 这个会话已经画到哪条事件 —— 库给的游标,只增
let ownsStream = false;  // 本页是不是那一轮直播流的持有者
let poller = null;       // 轮询定时器
let composerOn = null;   // 输入框上一刻的状态,用来只在"重新可用"时抢焦点

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 只有本来就贴着底才自动滚。正往上翻着看历史的时候,新内容不该把你拽走。
function follow() {
  const near = log.scrollHeight - log.scrollTop - log.clientHeight < 120;
  if (near) log.scrollTop = log.scrollHeight;
}

function add(node, target) {
  (target || turn || stream).appendChild(node);
  follow();
}

// ---- 会话 ----
//
// 切会话一律走"清空 + 从库里重放",不给每个会话留一份 DOM。留 DOM 意味着
// stream / log / turn / call 全要变成 per-session(连滚动位置一起),而收益
// 只是省一次重放。重放这条路同时还覆盖了刷新页面 —— 一套代码管两种入口。

function when(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分";
  if (s < 86400) return Math.floor(s / 3600) + " 时";
  return Math.floor(s / 86400) + " 天";
}

function paintSessions() {
  list.replaceChildren();
  for (const s of SESSIONS) {
    const row = el("div", "row");

    const item = el("button", "sess");
    item.type = "button";
    if (s.id === current) item.setAttribute("aria-current", "true");
    item.appendChild(el("span", "t", s.title || "新会话"));
    if (s.running || s.waiting) {
      const dot = el("span", "dot" + (s.waiting ? " wait" : ""));
      dot.title = s.waiting ? "在等你确认" : "在跑";
      item.appendChild(dot);
    }
    item.appendChild(el("span", "when", when(s.updated_at)));
    item.onclick = () => { if (s.id !== current) switchTo(s.id); };
    row.appendChild(item);

    // 删除是兄弟节点,不是嵌在 .sess 里 —— 按钮里套按钮是无效 HTML,
    // 浏览器会把它挪走,点击行为变得莫名其妙。
    const kill = el("button", "kill", "×");
    kill.type = "button";
    kill.title = "删除这个会话";
    kill.onclick = () => removeSession(s.id);
    row.appendChild(kill);

    list.appendChild(row);
  }
}

async function refreshSessions() {
  let sessions;
  try {
    sessions = (await (await fetch(API + "/sessions")).json()).sessions;
  } catch {
    return;   // 后端暂时不在。这里弹错只会刷屏,下次刷新会补上
  }
  SESSIONS = sessions;
  paintSessions();
  setHeader(sessions.some(s => s.running), sessions.some(s => s.waiting));
}

// 侧栏那两个点(在跑 / 在等你确认)是**服务端**的状态,不主动问就不知道。
// 而事件正好告诉我们它什么时候变:you = 这一轮开始了,ask = 有人在等你。
//
// 合并一下再发:重放一个长会话时 you/ask 会连着来一串,不合并就是一串
// 请求 —— 而且它们说的是同一件事(侧栏现在长什么样)。
let refreshTimer = null;
function refreshSessionsSoon() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; refreshSessions(); }, 200);
}

// 同一条事件可能从两条路来(直播流、切回来时的重放或轮询),两边各画一次
// 就重复了。seq 是库给的、只增,画过的不再画 —— 于是"谁先到"不重要了,
// 不用在两边各写一套状态机。
function renderIfNew(ev) {
  if (typeof ev.seq === "number") {
    if (ev.seq <= lastSeq) return;
    lastSeq = ev.seq;
  }
  render(ev);
}

// 直播流的每一条都从这儿过:只有它正好是屏幕上那个会话才画。
//
// 切走了就丢掉不画 —— 事件已经在库里了,切回来时重放会补上。
//
// 但**绝不能**用 reader.cancel() 去"清理"它:取消 = 关连接 = 服务端下一次
// 写抛 OSError = make_ask 收到"没人能回答" = 一个正在等你的确认被悄悄按
// 拒绝处理掉。看起来像个无害的清理动作,代价是把权限那道门拆了。
function feed(sid, ev) {
  if (sid === current) renderIfNew(ev);
}

async function catchUp() {
  if (!current) return false;
  const r = await fetch(API + "/session/" + current + "/events?since=" + lastSeq);
  if (!r.ok) return false;
  const data = await r.json();
  for (const ev of data.events) renderIfNew(ev);
  setComposer(!data.running);
  if (data.running && !ownsStream) startPolling();
  else stopPolling();
  return data.running;
}

// 只在"当前会话在跑,而这条流不归本页"时才转。覆盖两种情形:页面刷过
// (那条 POST 流没了),以及轮是别的标签页起的。
function startPolling() {
  if (poller) return;
  poller = setInterval(async () => {
    if (document.hidden) return;
    if (!(await catchUp())) { stopPolling(); }
    refreshSessionsSoon();
  }, 1500);
}

function stopPolling() {
  if (poller) { clearInterval(poller); poller = null; }
}

function blankScreen() {
  stream.replaceChildren();     // 一块清掉,比逐条摘干净
  turn = null;
  call = null;
  lastSeq = 0;
}

async function switchTo(sid) {
  current = sid;
  localStorage.setItem("agent.session", sid);
  stopPolling();
  blankScreen();
  paintSessions();              // 选中态立刻生效,不等网络
  await catchUp();
  refreshSessions();
}

async function newSession() {
  let id;
  try {
    const r = await fetch(API + "/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    id = (await r.json()).id;
  } catch (err) {
    add(el("div", "error", "建会话失败: " + err));
    return;
  }
  SESSIONS = [{ id, title: "", updated_at: Date.now() / 1000,
                running: false, waiting: false }, ...SESSIONS];
  current = id;
  localStorage.setItem("agent.session", id);
  stopPolling();
  blankScreen();
  paintSessions();
  setComposer(true);
}

async function removeSession(sid) {
  const r = await fetch(API + "/session/" + sid + "/delete", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: "{}",
  });
  if (!r.ok) {
    add(el("div", "error", "没删掉: 后端 " + r.status +
        (r.status === 409 ? "(这一轮还在跑)" : "")));
    return;
  }
  SESSIONS = SESSIONS.filter(s => s.id !== sid);
  if (sid !== current) { paintSessions(); return; }

  current = null;
  localStorage.removeItem("agent.session");
  stopPolling();
  blankScreen();
  if (SESSIONS.length) await switchTo(SESSIONS[0].id);
  else { paintSessions(); setComposer(true); }
}

// ---- markdown → DOM ----
//
// 全程 createElement / createTextNode,一个 innerHTML 都不用。这不是洁癖,
// 是这次改动唯一的安全约束:模型读过的文件内容会进回复,那是不受信的。
// 走 innerHTML 的话,文件里写一句 <img onerror=...> 就能在页面里跑 JS,
// 而页面跟后端同源 —— 那段 JS 反过来能 POST /answer 替你把权限批了。
// 造节点这条路上,"注入"在结构上就不可能,连转义函数都不需要。
//
// 不管的:图片、内联 HTML(故意的,理由见上)、setext 标题、引用式链接、
// 脚注。够用就行,不够再加。

// 这一组是"块的起手式"。dispatch 和 startsBlock 必须用同一组 —— 两处改岔了
// 就是一个吃不到行的死循环,见下面段落那段。
const FENCE   = /^```\S*\s*$/;
const RULE    = /^\s*([-*_])\s*(\1\s*){2,}$/;
const HEADING = /^(#{1,6})\s+(.*)$/;
const QUOTE   = /^\s*>/;
const ITEM    = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map((cell) => cell.trim());
}

// 分隔行:每个格子都是 --- 、:--- 、---: 或 :---: ,只管对齐和划线。
function isSeparatorRow(line) {
  return splitRow(line).every((cell) => /^:?-+:?$/.test(cell));
}

// 表格跟上面几个块不一样:它得**看下一行**才知道自己是不是表格。
//
// 判据是两个一起用:这一行有竖线,且下一行是分隔行,**且两边格子数一样**
// (GFM 本来就这么要求)。只认竖线的话,正文里一句 "a | b" 会变成表格;
// 只认"下一行是分隔行"的话,"---" 只是一条分割线。
function startsTable(lines, i) {
  if (i + 1 >= lines.length || !lines[i].includes("|")) return false;
  return isSeparatorRow(lines[i + 1]) &&
         splitRow(lines[i]).length === splitRow(lines[i + 1]).length;
}

function startsBlock(lines, i) {
  const line = lines[i];
  return FENCE.test(line) || RULE.test(line) || HEADING.test(line) ||
         QUOTE.test(line) || ITEM.test(line) || startsTable(lines, i);
}

// 行内。分支顺序就是优先级:行内代码排最前,否则 `a**b**c` 里的星号会被
// 当成粗体。
//
// 每次调用现造一个正则:正则对象带 lastIndex 状态,而这个函数会递归
// (粗体里面还能有行内代码)—— 共用一个的话,内层扫描会把外层的进度冲掉。
const inlineRe = () =>
  /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(__[^_\n]+__)|(\*[^*\n]+\*)|(_[^_\n]+_)|(\[[^\]\n]*\]\([^)\n]+\))/g;

function safeHref(url) {
  // 只认 http/https。javascript: 和 data: 能让 <a href> 变成执行入口,
  // 而这段文字来自模型,模型又是从文件和网页里读来的。
  try {
    const u = new URL(url, location.href);
    return /^https?:$/.test(u.protocol) ? u.href : null;
  } catch {
    return null;
  }
}

function inline(text, parent) {
  const re = inlineRe();
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) {
      parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const tok = m[0];
    if (tok[0] === "`") {
      parent.appendChild(el("code", "ic", tok.slice(1, -1)));
    } else if (tok.startsWith("**") || tok.startsWith("__")) {
      const s = el("strong", null, "");
      inline(tok.slice(2, -2), s);
      parent.appendChild(s);
    } else if (tok[0] === "*" || tok[0] === "_") {
      const e = el("em", null, "");
      inline(tok.slice(1, -1), e);
      parent.appendChild(e);
    } else {
      const mm = /^\[([^\]]*)\]\(([^)]+)\)$/.exec(tok);
      const href = safeHref(mm[2]);
      if (!href) {
        // 不是 http/https,原样显示 —— 不给它变成链接的机会,也不吞掉,
        // 免得看起来像内容丢了。
        parent.appendChild(document.createTextNode(tok));
      } else {
        const a = el("a", null, "");
        a.href = href;
        a.target = "_blank";
        a.rel = "noreferrer noopener";
        inline(mm[1], a);
        parent.appendChild(a);
      }
    }
    last = re.lastIndex;
  }
  if (last < text.length) {
    parent.appendChild(document.createTextNode(text.slice(last)));
  }
}

function renderList(lines, i, parent) {
  const flat = (s) => s.replace(/\t/g, "    ");

  // 先把整段列表行收下来。续行(缩进比当前项更深的非列表行)并进上一项,
  // 否则"1. 标题\n   继续说明"会被拆成列表后面跟一个孤立段落。
  const items = [];
  while (i < lines.length) {
    const m = ITEM.exec(lines[i]);
    if (m) {
      items.push({ indent: flat(m[1]).length,
                   ordered: /\d/.test(m[2]),
                   text: m[3] });
      i++;
      continue;
    }
    const prev = items[items.length - 1];
    if (prev && lines[i].trim() && /^\s/.test(lines[i]) &&
        flat(lines[i]).match(/^\s*/)[0].length > prev.indent) {
      prev.text += " " + lines[i].trim();
      i++;
      continue;
    }
    break;
  }
  if (!items.length) return i;

  // 拿缩进当层级:变深就开子列表挂在上一项的 <li> 底下,变浅就弹回去。
  // 比数空格更好使的是栈 —— 一次遍历,不用递归。
  const root = document.createElement(items[0].ordered ? "ol" : "ul");
  parent.appendChild(root);
  const stack = [{ indent: items[0].indent, node: root, li: null }];

  for (const it of items) {
    while (stack.length > 1 && it.indent < stack[stack.length - 1].indent) {
      stack.pop();
    }
    let top = stack[stack.length - 1];
    if (it.indent > top.indent) {
      const sub = document.createElement(it.ordered ? "ol" : "ul");
      (top.li || top.node).appendChild(sub);
      top = { indent: it.indent, node: sub, li: null };
      stack.push(top);
    }
    const li = document.createElement("li");
    inline(it.text, li);
    top.node.appendChild(li);
    top.li = li;          // 供下一行开子列表时挂靠
  }
  return i;
}

function renderTable(lines, i, parent) {
  const head = splitRow(lines[i]);
  // 对齐来自分隔行:`:---` 左、`---:` 右、`:---:` 居中、`---` 不管。
  const aligns = splitRow(lines[i + 1]).map((cell) => {
    if (cell.startsWith(":") && cell.endsWith(":")) return "center";
    if (cell.endsWith(":")) return "right";
    if (cell.startsWith(":")) return "left";
    return "";
  });
  i += 2;

  // 表体吃到"不再是表格行"为止。**按表头的列数补齐/截断**:模型偶尔会多写
  // 或少写一格,不管的话这一行会把整张表撑歪(HTML 会自己补 td,但补出来的
  // 位置跟对齐都是错的)。
  const rows = [];
  while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
    const cells = splitRow(lines[i++]);
    rows.push(head.map((_, c) => cells[c] || ""));
  }

  const table = document.createElement("table");
  const hrow = table.createTHead().insertRow();
  head.forEach((text, c) => {
    const th = document.createElement("th");
    th.style.textAlign = aligns[c] || "";
    inline(text, th);
    hrow.appendChild(th);
  });
  const tbody = table.createTBody();
  for (const cells of rows) {
    const tr = tbody.insertRow();
    cells.forEach((text, c) => {
      const td = document.createElement("td");
      td.style.textAlign = aligns[c] || "";
      inline(text, td);
      tr.appendChild(td);
    });
  }

  // 包一层可横向滚动的壳:宽表不该把整个页面撑出一条横向滚动条。
  const wrap = el("div", "tw");
  wrap.appendChild(table);
  parent.appendChild(wrap);
  return i;
}

function renderReply(text) {
  const wrap = el("div", "reply");
  // 先去掉 \r:回复里可能带 CRLF(模型读进来的 Windows 文件内容就会)。
  // 留着的话每个文本节点尾巴都挂一个 —— 浏览器当空白不显示,但它会混进
  // 段落拼接里,没必要带着。
  const lines = text.replace(/\r/g, "").split("\n");
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    if (FENCE.test(line)) {
      const body = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;                                   // 闭括号那行(没闭合就是收尾)
      wrap.appendChild(el("pre", "code", body.join("\n")));
      continue;
    }

    if (RULE.test(line)) {
      wrap.appendChild(el("hr"));
      i++;
      continue;
    }

    const h = HEADING.exec(line);
    if (h) {
      const node = el("h" + h[1].length, null, "");
      inline(h[2], node);
      wrap.appendChild(node);
      i++;
      continue;
    }

    if (QUOTE.test(line)) {
      const q = el("blockquote", null, "");
      let first = true;
      while (i < lines.length && QUOTE.test(lines[i])) {
        if (!first) q.appendChild(el("br"));
        inline(lines[i++].replace(/^\s*>\s?/, ""), q);
        first = false;
      }
      wrap.appendChild(q);
      continue;
    }

    if (startsTable(lines, i)) {
      i = renderTable(lines, i, wrap);
      continue;
    }

    if (ITEM.test(line)) {
      i = renderList(lines, i, wrap);
      continue;
    }

    // 段落。行间的换行留成 <br>:标准 markdown 会把它们并成空格,但模型输出
    // 的换行通常是有意的(路径、步骤一行一个),并掉反而难读。
    const p = el("p", null, "");
    let first = true;
    while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) {
      if (!first) p.appendChild(el("br"));
      inline(lines[i++], p);
      first = false;
    }
    // 上面那个判断跟外面的 dispatch 是同一组,第一行理论上必定进得了循环。
    // 但两处将来改岔了就是个 i 不动的死循环,所以兜一手:一行都没吃到,
    // 就把这行原样吐出去再前进 —— 保证每轮都有进展。
    if (first) p.appendChild(document.createTextNode(lines[i++]));
    wrap.appendChild(p);
  }

  if (!wrap.childNodes.length) wrap.appendChild(el("p", null, text));
  return wrap;
}

// 一次调用和它的输出要贴在一起 —— 事件是分两条来的,靠这个把结果接回
// 上一次调用底下。否则一屏工具的时候,根本看不出哪段输出属于哪次调用。
let call = null;

// 权限确认。后端那条 /ask 流还开着,agent 线程正挂在 ask 里等回答 ——
// 所以这个框点了才有下文,不点就一直等(后端 300s 超时后按拒绝走)。
function renderAsk(ev) {
  // live 是服务端查 PENDING 得出的:重放里出现的 ask **可能还活着** ——
  // 切走再切回来时那一轮还在跑,槽还在,点下去是真有用的。所以只有明确
  // false 才画成历史。直播流里的事件没有这个字段(它本来就是活的)。
  if (ev.live === false) {
    const done = el("div", "ask done");
    done.appendChild(el("div", "q", ev.question));
    done.appendChild(el("div", "settled", "（历史记录，已无法回答）"));
    return done;
  }

  const box = el("div", "ask");
  box.appendChild(el("div", "q", ev.question));

  const row = el("div", "row");
  const yes = el("button", "yes", "允许");
  const no = el("button", "no", "拒绝");
  yes.onclick = () => settle(true);
  no.onclick = () => settle(false);

  async function settle(allow) {
    row.querySelectorAll("button").forEach((b) => { b.disabled = true; });
    box.classList.add("done");
    const mark = el("span", "settled", allow ? "已允许" : "已拒绝");
    row.appendChild(mark);
    hint.textContent = "运行中…";
    try {
      const r = await fetch(API + "/answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: ev.id, allow }),
      });
      // 409:后端已经超时清掉了那个槽,那一轮早就按拒绝往下走了。
      // 不是错误,说一声就够 —— 别让人以为自己的点击生效了。
      if (!r.ok) mark.textContent += "(后端 " + r.status + ",已按拒绝处理)";
    } catch (err) {
      // 送不到后端 = 那个槽会等到超时然后拒绝。后果是保守的那一侧,
      // 所以只提示,不用重试。
      add(el("div", "error", "确认没送到后端,这一轮会按拒绝处理: " + err));
    }
  }

  row.append(yes, no);
  box.appendChild(row);
  hint.textContent = "等待确认…";
  return box;
}

// 推理过程。默认收起:它是过程不是结论,跟工具输出同一档 —— 想知道就
// 展开,不想知道就别占着屏幕。标题给一小段预览,不用展开也能看出它在
// 想什么。
function renderThinking(ev) {
  const d = document.createElement("details");
  d.className = "think";
  // filter 掉空行再取前两行:推理里常有空行,不过滤的话预览会留下
  // 一个孤零零的分隔符("第一行 / ")。
  const head = ev.text.trim().split("\n").filter((l) => l.trim())
                     .slice(0, 2).join(" / ").slice(0, 140);
  d.appendChild(el("summary", null, head || "推理过程"));
  d.appendChild(el("pre", null, ev.text));
  return d;
}

function render(ev) {
  if (ev.kind === "you") {
    // 用户那句话也是服务端发的一条事件,不再在提交时自己画 —— 否则重放
    // 出来的会是一串"没有问题的回答":那句问题从来没有进过事件流。
    // 每条 you 开启新一轮(它跟 tool_call/reply 共用 turn 这个游标)。
    turn = el("section", "turn");
    stream.appendChild(turn);
    add(el("div", "you", ev.text));
    refreshSessionsSoon();   // 这一轮开始了:侧栏那个点该亮起来

  } else if (ev.kind === "thinking") {
    add(renderThinking(ev));

  } else if (ev.kind === "tool_call") {
    call = el("div", "call");
    const row = el("div", "tool");
    row.appendChild(el("span", "name", ev.name));
    row.appendChild(el("span", "args", JSON.stringify(ev.input)));
    call.appendChild(row);
    add(call);

  } else if (ev.kind === "tool_result") {
    const head = ev.output.trim().split("\n").slice(0, 2).join(" / ").slice(0, 140);
    const d = document.createElement("details");
    d.className = "result";
    d.appendChild(el("summary", null, head || "(没有输出)"));
    d.appendChild(el("pre", null, ev.output));
    add(d, call);
    call = null;

  } else if (ev.kind === "note") {
    add(el("div", "note", ("[" + ev.source + "] " + ev.text).trimEnd()));

  } else if (ev.kind === "ask") {
    add(renderAsk(ev));
    refreshSessionsSoon();   // 有人被挂住了,侧栏那个点要变蓝

  } else if (ev.kind === "reply") {
    add(renderReply(ev.text));

  } else {
    // 认不出来的也显示,别默默吞掉 —— 将来加了新 kind,页面上至少
    // 看得出来,而不是凭空少一段。
    add(el("div", "note", JSON.stringify(ev)));
  }
}

// 以前一个 setBusy 把两件事捏在一起。多会话之后它们不再是一回事:另一个
// 会话在跑,当前这个照样能输入。
//
// setHeader 说的是"全部会话里有没有动静"(顶栏那个点),setComposer 说的是
// "当前这个会话能不能输入"。
function setHeader(anyRunning, anyWaiting) {
  head.classList.toggle("busy", anyRunning && !anyWaiting);
  head.classList.toggle("waiting", anyWaiting);
}

function setComposer(enabled) {
  box.disabled = !enabled;
  send.disabled = !enabled;
  hint.textContent = enabled ? "Enter 发送 · Shift+Enter 换行" : "运行中…";
  // 只在"从不可用变成可用"时抢焦点。轮询每 1.5 秒调一次这个函数,每次都
  // focus 的话,你正在页面上选中的文字每隔 1.5 秒就没了。
  if (enabled && composerOn === false) box.focus();
  composerOn = enabled;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = box.value.trim();
  if (!query) return;

  // 还没有会话就现建一个。两次请求,比"让服务端在流里回一条 session 事件"
  // 直白 —— 那条协议只为这一处存在,却要先在流开头定义一个只出现过一次的
  // 事件类型。
  if (!current) {
    await newSession();
    if (!current) return;          // 建失败了,错误已经显示过
  }
  const sid = current;

  box.value = "";
  setComposer(false);

  // 必须发 application/json:这个 Content-Type 不在 CORS 的白名单里,
  // 浏览器因此必须先发预检。后端只对同机来源回 Allow-Origin,所以
  // 别的网页发来的请求会被浏览器掐在预检那一步,根本到不了后端。
  // 换成 text/plain 就退化成"简单请求",绕过预检直接开跑。
  let res;
  try {
    res = await fetch(API + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sid, query }),
    });
  } catch (err) {
    box.value = query;             // 送不出去就把话还回去,别让人白打一遍
    add(el("div", "error", backendHint(err)));
    setComposer(true);
    return;
  }

  if (!res.ok) {
    // 409 的含义跟以前不同了:以前是"有一轮在跑",现在是"**这个会话**有
    // 一轮在跑" —— 别的会话照跑不误。
    box.value = query;
    add(el("div", "error", "后端返回 " + res.status +
        (res.status === 409 ? "(这个会话上一轮还在跑)"
         : res.status === 404 ? "(这个会话不在了,新建一个再发)" : "")));
    setComposer(true);
    return;
  }

  // 逐块读,不 await res.text() —— 那样要等整轮跑完才拿到内容,
  // 就没有"看着它干活"这回事了。
  //
  // 用户那句话不在这儿画:服务端会发一条 you 事件过来(见 render)。自己
  // 先画一遍的话,重放时那句话说不出是从哪来的 —— 它从来没进过事件流。
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  ownsStream = true;

  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // 最后一段可能只到一半,留在 buf 里等下一块 —— 直接切会把一行
      // JSON 拦腰截断,JSON.parse 就炸了。
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (line.trim()) feed(sid, JSON.parse(line));
      }
    }
    if (buf.trim()) feed(sid, JSON.parse(buf));
  } catch (err) {
    if (sid === current) add(el("div", "error", "流断了: " + err));
  }
  ownsStream = false;

  // 收尾:这一轮的事件可能没画全(中途切走过),catchUp 补齐,顺带把
  // running 带回来。服务端是先放锁再关连接,所以读到 EOF 时问它,一般
  // 已经是 false —— 不会白转一个 1.5 秒的轮询。
  await catchUp();
  refreshSessions();
});

box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// 输入框跟着内容长高,最多到 CSS 里那个 max-height
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 200) + "px";
});

newBtn.addEventListener("click", newSession);

// fetch 在网络层失败时只给一句 "Failed to fetch",不说为什么 —— 后端没起、
// 预检被拒、端口写错,长得一模一样。所以把"试的是哪个地址"和"怎么办"
// 一起写出来,否则这句错误没法自助。
function backendHint(err) {
  return "连不上后端 " + (API || location.origin) + "。\n" +
    "  后端起了吗?在仓库目录跑:  .venv\\Scripts\\python.exe server.py\n" +
    "  起了的话,直接开 http://localhost:8765/ —— 同源,不用跨域\n" +
    "  (" + err + ")";
}

// 开页面:拉列表 → 回到上次那个会话(没有就用最近动过的)→ 重放它。
async function boot() {
  let sessions;
  try {
    sessions = (await (await fetch(API + "/sessions")).json()).sessions;
  } catch (err) {
    add(el("div", "error", backendHint(err)));
    return;
  }
  SESSIONS = sessions;
  paintSessions();
  setHeader(sessions.some(s => s.running), sessions.some(s => s.waiting));

  // 当前会话记在 localStorage 里,不用 URL 的 hash:hash 会往浏览器历史里
  // 塞记录,切会话就变成了切页面,返回键的行为变得莫名其妙(要修得配
  // pushState)。hash 的好处是可分享、可收藏 —— 给自己用的工具,不值。
  const saved = localStorage.getItem("agent.session");
  const pick = sessions.find(s => s.id === saved) || sessions[0];
  if (pick) await switchTo(pick.id);
  else setComposer(true);   // 一个会话都没有:照常能打字,发第一条时现建
}

boot();
</script>
