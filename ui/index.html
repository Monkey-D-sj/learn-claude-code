<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小鲸的工作台</title>
<script>
  try {
    const savedTheme = localStorage.getItem("agent.theme");
    document.documentElement.dataset.theme = ["light", "dark", "minimal", "minimal-dark"].includes(savedTheme) ? savedTheme : "light";
  } catch (_) {
    document.documentElement.dataset.theme = "light";
  }
</script>
<style>
  :root {
    --bg:      #0b0e14;
    --surface: #11151c;
    --raised:  #161b24;
    --line:    #1e242e;
    --fg:      #d4dae3;
    --dim:     #6e7a8a;
    --faint:   #4a5464;
    --you:     #7aa2f7;
    --tool:    #e0af68;
    --err:     #f7768e;

    --prose: ui-sans-serif, -apple-system, "Segoe UI", "Microsoft YaHei",
             "PingFang SC", "Noto Sans CJK SC", sans-serif;
    --mono:  ui-monospace, SFMono-Regular, Menlo, Consolas,
             "Cascadia Mono", monospace;

    --col: 880px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.7 var(--prose);
    -webkit-font-smoothing: antialiased;
    display: flex;              /* 横向:会话栏 + 正文 */
  }

  /* ---- 会话栏 ---- */
  #side {
    flex: none;
    width: 216px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--line);
    background: var(--surface);
  }
  #new {
    flex: none;
    margin: 10px 10px 6px;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--raised);
    color: var(--fg);
    font: 12.5px var(--prose);
    text-align: left;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #new:hover { background: #1d2430; border-color: #2f3a4d; }
  #list { flex: 1; overflow-y: auto; padding: 0 6px 10px; }
  #list::-webkit-scrollbar { width: 8px; }
  #list::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 8px; border: 2px solid var(--surface);
  }

  .row { display: flex; align-items: center; gap: 2px; }
  .sess {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 8px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--dim);
    font: 12.5px/1.45 var(--prose);
    text-align: left;
    cursor: pointer;
  }
  .sess:hover { background: var(--raised); color: var(--fg); }
  .sess[aria-current="true"] { background: var(--raised); color: var(--fg); }
  .sess .t {
    flex: 1;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sess .when { flex: none; color: var(--faint); font-size: 11px; }
  /* 在跑 / 在等你回答。跟顶栏那个点同一套语汇。 */
  .sess .dot {
    flex: none;
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--tool);
    animation: pulse 1.1s ease-in-out infinite;
  }
  .sess .dot.wait { background: var(--you); animation: none; }
  .kill {
    flex: none;
    padding: 0 4px;
    border: 0;
    background: transparent;
    color: var(--faint);
    font: 13px var(--mono);
    cursor: pointer;
    visibility: hidden;
  }
  .row:hover .kill { visibility: visible; }
  .kill:hover { color: var(--err); }

  /* ---- 正文 ---- */
  #main {
    flex: 1;
    min-width: 0;     /* 少了它,flex 子项会被内容撑破,--col 那个居中内层会溢出 */
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 700px) {
    #side { width: 150px; }
  }

  /* ---- 顶栏 ----
     选择器写 #head 而不是裸的 header:这一组说的是**顶上那条**,而页面里
     还有别的 <header>(每轮的抬头、旧版记录那块的小标题)。裸标签选择器
     会把它们一起染成一条 46px 高、带下边框的横条 —— 而且不报错,只是
     画出来不对。 */
  #head {
    flex: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    height: 46px;
    border-bottom: 1px solid var(--line);
    background: var(--surface);
    font-size: 12.5px;
    color: var(--dim);
  }
  #head .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--faint);
    transition: background .2s;
  }
  #head.busy .dot { background: var(--tool); animation: pulse 1.1s ease-in-out infinite; }
  #head.waiting .dot { background: var(--you); animation: none; }
  /* 够不着后端。写在 .busy/.waiting 之后是有意的:够不着的时候那两个类名都是
     上一次问到的旧值(刷新会话列表那一步也失败了,它是静默留着的),让红的赢 ——
     "连不上"才是此刻唯一确定的事。 */
  #head.down .dot { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  #head .name { color: var(--fg); font-weight: 600; letter-spacing: .2px; }
  #head .spacer { flex: 1; }

  /* ---- 日志 ---- */
  #log {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  #log::-webkit-scrollbar { width: 10px; }
  #log::-webkit-scrollbar-thumb {
    background: var(--line); border-radius: 10px;
    border: 3px solid var(--bg);
  }
  #log::-webkit-scrollbar-thumb:hover { background: #2b3341; }

  .inner { max-width: var(--col); margin: 0 auto; padding: 22px 20px 40px; }

  .turn { margin-bottom: 26px; }
  .turn + .turn { padding-top: 22px; border-top: 1px solid var(--line); }

  /* 一轮的抬头:轮号 + 终态。
     状态颜色跟着 data-status 走 —— 写三个类名的话,服务端将来多一个
     状态(比如 cancelled)就得回来改样式,而漏掉的表现是"没颜色",
     不报错。 */
  .thead {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 10px;
    font: 12px/1.6 var(--mono);
    color: var(--faint);
  }
  .thead .no { color: var(--dim); }
  .turn[data-status="running"] .thead .state { color: var(--tool); }
  .turn[data-status="failed"]  .thead .state { color: var(--err); }
  .turn[data-status="unsaved"] .thead .state { color: var(--err); }

  /* 一轮的花费小结。排在正文**下面**,不跟着抬头 —— 它是读完这一轮之后
     才想知道的数,不是开始读之前。抬头留轮号和状态,这儿留钱,不打架。

     mono 跟抬头对上,但颜色更暗一档:它是旁注,不该跟正文抢注意力。
     anywhere 而不是 break-all:这一行有空格和 ·,按词断就够了。 */
  .tfoot {
    margin-top: 14px;
    padding-top: 10px;
    border-top: 1px dashed var(--line);
    font: 12px/1.6 var(--mono);
    color: var(--faint);
    overflow-wrap: anywhere;
  }

  /* 旧版记录:轮次落库之前的那些会话。它们只有事件流,没有轮号可编,
     所以整块单独放着,跟新记录一眼分得开。 */
  .legacy {
    margin-bottom: 26px;
    padding: 16px 18px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
  }
  .legacy .lhead {
    font: 12px/1.6 var(--mono);
    color: var(--faint);
    margin-bottom: 16px;
  }
  .legacy .turn:last-child { margin-bottom: 0; }

  /* ---- 你说的话 ---- */
  .you {
    background: var(--raised);
    border-left: 2px solid var(--you);
    border-radius: 0 8px 8px 0;
    padding: 10px 14px;
    margin-bottom: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* ---- 一次工具调用 + 它的输出,算一个整体 ---- */
  .call { margin-bottom: 14px; }
  .call:last-child { margin-bottom: 0; }

  .tool {
    display: flex;
    align-items: baseline;
    gap: 9px;
    font: 12.5px/1.6 var(--mono);
    margin-bottom: 4px;
  }
  .tool .name {
    color: var(--tool);
    font-weight: 600;
    flex: none;
  }
  .tool .args {
    color: #5c6878;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ---- 参数太长的那一行 ----
     短的一行到底(上面那条);长的包成这个,折叠时长得跟短的一模一样,
     展开给格式化的完整 JSON。

     **只包参数,不包整个 .call。** 工具输出是后面那条消息按 tool_use_id
     挂到 .call 上的 —— 包进来它就跟着被折叠了,参数一收起输出凭空消失,
     而且不报错。
     summary 就是那一行本体(还是 .tool),三角额外加在它前面,所以长了之后
     整行右移 13px —— 跟 details.result 同一个做法,看着是一套。 */
  details.args > summary {
    list-style: none;
    cursor: pointer;
    margin-bottom: 4px;
  }
  details.args > summary::-webkit-details-marker { display: none; }
  details.args > summary::before {
    content: "▸";
    display: inline-block;
    width: 13px;
    flex: none;
    color: var(--faint);
  }
  details.args[open] > summary::before { content: "▾"; }
  details.args > summary:hover .args { color: var(--fg); }

  /* ---- 工具输出 ---- */
  details.result {
    border-left: 2px solid var(--line);
    padding-left: 11px;
  }
  details.result > summary {
    list-style: none;
    cursor: pointer;
    font: 12.5px/1.6 var(--mono);
    color: var(--dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  details.result > summary::-webkit-details-marker { display: none; }
  details.result > summary::before {
    content: "▸";
    display: inline-block;
    width: 13px;
    color: var(--faint);
  }
  details.result[open] > summary::before { content: "▾"; }
  details.result > summary:hover { color: var(--fg); }
  details.result pre,
  details.args > pre {
    margin: 8px 0 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12.5px/1.65 var(--mono);
    color: var(--dim);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow: auto;
  }

  /* ---- 推理过程 ----
     跟工具输出同一套折叠结构(点标题展开),但压得更暗、加斜体:它是
     "过程",不该跟模型的结论抢注意力。默认收起也是同一个道理。 */
  details.think { margin-bottom: 10px; }
  details.think > summary {
    list-style: none;
    cursor: pointer;
    font: 12.5px/1.6 var(--mono);
    font-style: italic;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before {
    content: "▸";
    display: inline-block;
    width: 13px;
    font-style: normal;
  }
  details.think[open] > summary::before { content: "▾"; }
  details.think > summary:hover { color: var(--dim); }
  details.think > pre {
    margin: 8px 0 10px;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12.5px/1.65 var(--mono);
    color: var(--faint);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 420px;
    overflow: auto;
  }

  /* ---- 模型的回复 ----
     段落不再用 white-space: pre-wrap —— 换行现在由解析器发成 <br>,
     两个一起上会变成双倍行距。 */
  .reply { margin-top: 18px; }
  /* 正在流的那一块:字是一片片追加的,还没过解析器,所以先按预格式保留
     换行(推理那块上面已经有了)。完整的那条一到,整块会被成品换掉,
     样式跟着变成正式的那套。 */
  .reply.live { white-space: pre-wrap; word-break: break-word; }
  .reply p {
    margin: 0 0 10px;
    word-break: break-word;
  }
  .reply p:last-child { margin-bottom: 0; }
  .reply pre.code {
    margin: 0 0 10px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 12.5px/1.7 var(--mono);
    color: #c8d3e0;
    overflow-x: auto;
  }

  /* 标题压小:聊天里 h1 那种体量会把上下文挤没,但层级还得看得出来 */
  .reply h1, .reply h2, .reply h3,
  .reply h4, .reply h5, .reply h6 {
    margin: 18px 0 8px;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.5;
    color: #e6ebf2;
  }
  .reply h1, .reply h2 { font-size: 15px; }
  .reply > :first-child { margin-top: 0; }

  .reply ul, .reply ol { margin: 0 0 10px; padding-left: 22px; }
  .reply li { margin: 3px 0; }
  .reply li > ul, .reply li > ol { margin: 3px 0 0; }

  .reply blockquote {
    margin: 0 0 10px;
    padding: 2px 0 2px 12px;
    border-left: 2px solid var(--line);
    color: var(--dim);
  }

  .reply hr {
    margin: 16px 0;
    border: 0;
    border-top: 1px solid var(--line);
  }

  .reply a {
    color: var(--you);
    text-decoration: none;
    border-bottom: 1px solid #2b3a55;
  }
  .reply a:hover { border-bottom-color: var(--you); }

  .reply code.ic {
    padding: 1px 5px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 4px;
    font: 12.5px/1.5 var(--mono);
    color: #c8d3e0;
  }
  /* ---- 表格 ----
     外面那层 .tw 是可横向滚动的壳:宽表不该把整个页面撑出一条横向滚动条。 */
  .reply .tw { overflow-x: auto; margin: 0 0 12px; }
  .reply table {
    border-collapse: collapse;
    font-size: 13px;
  }
  .reply th, .reply td {
    border: 1px solid var(--line);
    padding: 6px 11px;
    vertical-align: top;
    word-break: break-word;
  }
  .reply th {
    background: var(--surface);
    color: #e6ebf2;
    font-weight: 600;
    white-space: nowrap;
  }

  .reply strong { color: #e6ebf2; font-weight: 600; }
  .reply em { color: #c8d3e0; }

  /* ---- 压缩 / 重试之类的旁注 ---- */
  .note {
    font: 12px/1.6 var(--mono);
    color: var(--faint);
    margin: 3px 0 3px 2px;
  }
  .error { color: var(--err); font: 12.5px/1.6 var(--mono); margin: 6px 0; }
  .copy { padding: 2px 8px; margin-top: 4px; background: var(--raised);
    color: var(--fg); border: 1px solid var(--line); border-radius: 6px;
    font: 12px var(--mono); cursor: pointer; }
  .copy:hover { background: #1d2430; border-color: #2f3a4d; }

  /* ---- 权限确认 ----
     不在 #bar 里,所以 setComposer 禁输入框的时候它照样可点 —— agent 那头
     正挂在这条确认上,按不动就等于整轮卡死。 */
  .ask {
    border: 1px solid #3a2f1a;
    background: #17130c;
    border-radius: 8px;
    padding: 11px 13px;
    margin: 10px 0;
  }
  .ask .q {
    font: 12.5px/1.65 var(--mono);
    color: var(--tool);
    word-break: break-word;
  }
  .ask .row { display: flex; gap: 8px; align-items: center; margin-top: 10px; }
  .ask button {
    flex: none;
    padding: 5px 14px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--raised);
    color: var(--fg);
    font: 12.5px var(--prose);
    cursor: pointer;
    transition: border-color .15s, color .15s;
  }
  .ask button.yes:hover:not(:disabled) { border-color: #3f6b3f; color: #a8d5a8; }
  .ask button.no:hover:not(:disabled)  { border-color: #6b3f3f; color: #f0a0a8; }
  .ask button:disabled { opacity: .4; cursor: default; }
  .ask.done .q { color: var(--faint); }
  .ask .settled { font: 12px/1.6 var(--mono); color: var(--faint); }

  /* 模型提问(ask 工具)。跟上面那条确认共用 .ask 的外壳和 .row,只是
     把"两个按钮"换成"几个选项 + 一个输入框"。 */
  .ask .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .ask .opts button { padding: 5px 11px; }
  .ask .opts button:hover:not(:disabled) { border-color: #2f3a4d; background: #1d2430; }
  .ask input {
    flex: 1;
    min-width: 0;
    padding: 6px 10px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: 12.5px var(--mono);
  }
  .ask input::placeholder { color: var(--faint); }
  .ask input:focus { outline: none; border-color: #2f3a4d; }

  /* ---- 输入 ---- */
  #bar {
    flex: none;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  #bar .inner {
    display: flex;
    gap: 10px;
    align-items: flex-end;
    padding: 14px 20px 16px;
  }
  #q {
    flex: 1;
    resize: none;
    height: 44px;
    max-height: 200px;
    padding: 11px 14px;
    background: var(--bg);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13.5px/1.5 var(--prose);
    transition: border-color .15s;
  }
  #q::placeholder { color: var(--faint); }
  #q:focus { outline: none; border-color: #2f3a4d; }
  #q:disabled { opacity: .45; }
  #send {
    flex: none;
    height: 44px;
    padding: 0 20px;
    background: var(--raised);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 8px;
    font: 13.5px var(--prose);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  #send:hover:not(:disabled) { background: #1d2430; border-color: #2f3a4d; }
  #send:disabled { opacity: .4; cursor: default; }

  /* 鲸鱼娘主题：保留原有结构与交互，只换视觉层。 */
  :root {
    --bg: #f4f9fd;
    --surface: #ffffff;
    --raised: #eef6fc;
    --line: #dceaf5;
    --fg: #25445f;
    --dim: #68839a;
    --faint: #97aec0;
    --you: #578bd0;
    --tool: #d49a6b;
    --err: #dc788c;
    --col: 900px;
  }
  body {
    background: radial-gradient(circle at 82% 10%, #dff4ff 0, transparent 30%),
      radial-gradient(circle at 20% 90%, #fff0e4 0, transparent 27%), var(--bg);
    font-size: 14px;
  }
  #side {
    width: 250px;
    background: linear-gradient(180deg, #e8f5ff, #f7fbff 48%, #fff9f5);
    border-right-color: #d4e8f5;
    padding: 16px 10px;
  }
  .brand { display: flex; align-items: center; gap: 11px; padding: 7px 10px 18px; }
  .brand-mark {
    display: grid; place-items: center; width: 43px; height: 43px; flex: none;
    background: #d8edff; border: 1px solid #c3e2fa; border-radius: 16px;
    box-shadow: 0 7px 18px #75a9d82b; font-size: 25px;
  }
  .brand strong { display: block; color: #2e628d; font-size: 16px; line-height: 1.35; }
  .brand small { display: block; color: #8ba8bb; font-size: 10px; letter-spacing: .12em; }
  .side-label { color: #9ab0bf; font-size: 11px; letter-spacing: .12em; padding: 20px 14px 8px; }
  #new {
    margin: 0 7px 2px; padding: 12px 14px; border: 0; border-radius: 13px;
    color: white; background: linear-gradient(135deg, #68a9df, #497ec9);
    font-size: 13px; font-weight: 700; box-shadow: 0 8px 18px #5c9bd64d;
  }
  #new:hover { background: linear-gradient(135deg, #79b8e9, #568bd2); border: 0; }
  #list { padding: 0 5px 10px; }
  .row { gap: 4px; }
  .sess { padding: 10px 11px; border-radius: 11px; color: #708ba2; }
  .sess:hover, .sess[aria-current="true"] { background: #fff; color: #386488; box-shadow: 0 3px 12px #8bb9dd22; }
  .sess[aria-current="true"] { font-weight: 650; }
  .kill { visibility: visible; color: #adc0cf; }
  #main { position: relative; }
  #head {
    height: 68px; padding: 0 30px; background: #ffffffd9;
    border-bottom-color: #e1edf5; backdrop-filter: blur(14px);
  }
  #head .dot { width: 9px; height: 9px; background: #91caaa; box-shadow: 0 0 0 4px #dff4e8; }

    .pet-figure img, #pet.happy .pet-figure img,
    #pet.eating .pet-figure img, #pet.dancing .pet-figure img { animation: none; }
    .pet-spark { display: none; }
  }
</style>
</head>
<body>

<aside id="side">
  <div class="brand"><span class="brand-mark" aria-hidden="true">🐳</span><span class="brand-copy"><strong>小鲸的工作台</strong><small>DEEP BLUE COMPANION</small></span></div>
  <button id="new" type="button">＋ 新会话</button>
  <div class="side-label">最近的对话</div>
  <div id="list"></div>
</aside>

<main id="main">

<header id="head">
  <span class="dot"></span>
  <span class="name">小鲸的工作台</span>
  <span class="spacer"></span>
  <select id="theme-select" aria-label="外观模式">
    <option value="light">浅色</option>
    <option value="dark">暗黑</option>
    <option value="minimal">极简</option>
    <option value="minimal-dark">极简深色</option>
  </select>
  <button id="pet-toggle" type="button" aria-controls="pet" aria-expanded="true">收起小鲸</button>
  <span id="hint">Enter 发送 · Shift+Enter 换行</span>
</header>

<div id="log"><div class="inner" id="stream"></div></div>

<form id="bar">
  <div class="inner">
    <textarea id="q" rows="1" placeholder="问点什么…" autofocus></textarea>
    <button id="send" type="submit">发送</button>
  </div>
</form>

</main>

<div id="pet" role="group" aria-label="鲸鱼娘桌宠">
  <div class="pet-actions" id="pet-actions" role="group" aria-label="和小鲸互动">
    <button type="button" data-pet-action="pet">摸摸</button>
    <button type="button" data-pet-action="feed">喂饭</button>
    <button type="button" data-pet-action="dance">跳舞</button>
    <button type="button" data-pet-action="home">归位</button>
  </div>
  <div class="pet-bubble" id="pet-speech" aria-live="polite">点我互动，也能拖着走～</div>
  <button class="pet-figure" id="pet-figure" type="button" aria-label="摸摸小鲸；可以拖动" aria-controls="pet-actions" aria-expanded="false">
    <img src="/assets/whale-girl.png" alt="抱着饭碗的鲸鱼娘小鲸" draggable="false">
  </button>
</div>

<script>
// 后端在哪儿。页面由后端自己发出来的时候走相对路径就行;从别处打开
// —— 比如 IDE 的内置预览服务(63342)—— 相对路径会打到那个服务上,那边
// 没有 /ask,于是 404。所以按端口判断一下,不是后端发的就显式指过来。
//
// 改后端端口的话,server.py 的 PORT 和这行要一起改。
//
// ?backend= 是给那堆一次性检查脚本用的:它们要在自己的端口上起一个临时库的
// 实例,而绝不能去抢 8765 —— 那是你正开着的那个服务(它们以前会 taskkill
// 掉它,页面于是死在"流断了: TypeError: network error")。
//
// 只认本机地址:这个参数会让页面把事件流、把 /ask、把"允许"指到一个任意
// 后端上,给它一道门跟 server.py 里 is_local_origin 是同一路的谨慎。少了
// 那个正则,一条链接就能把这一页交出去。
const DEFAULT_BACKEND = "http://127.0.0.1:8765";
const BACKEND = (() => {
  const v = new URLSearchParams(location.search).get("backend");
  return v && /^http:\/\/(127\.0\.0\.1|localhost):\d+$/.test(v) ? v : DEFAULT_BACKEND;
})();
const API = location.port === String(new URL(BACKEND).port) ? "" : BACKEND;

const stream = document.getElementById("stream");
const log = document.getElementById("log");
const head = document.getElementById("head");
const form = document.getElementById("bar");
const box = document.getElementById("q");
const send = document.getElementById("send");
const hint = document.getElementById("hint");
const list = document.getElementById("list");
const newBtn = document.getElementById("new");
const themeSelect = document.getElementById("theme-select");
function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  themeSelect.value = theme;
  localStorage.setItem("agent.theme", theme);
}
setTheme(document.documentElement.dataset.theme);
themeSelect.addEventListener("change", () => setTheme(themeSelect.value));
const pet = document.getElementById("pet");
const petToggle = document.getElementById("pet-toggle");
const petFigure = document.getElementById("pet-figure");
const petSpeech = document.getElementById("pet-speech");
// 页面本身由 agent 服务发出时，图片跟页面走同一个来源。
// 这样临时预览端口刷新后仍能加载图片；IDE 的 /ui/index.html 预览则走后端。
const petAssetOrigin = location.pathname === "/" ? location.origin : (API || location.origin);
petFigure.querySelector("img").src = petAssetOrigin + "/assets/whale-girl.png";

const petActions = document.getElementById("pet-actions");
const petMotions = ["happy", "eating", "dancing"];
const petReactions = {
  pet: {motion: "happy", line: "摸摸收到！再来一下～", spark: "💙", duration: 1500},
  feed: {motion: "eating", line: "好吃！小鲸又有力气啦 🍚", spark: "🍚", duration: 2400},
  dance: {motion: "dancing", line: "看我转个圈！✨", spark: "✨", duration: 2800}
};
let petMotionTimer = null;
let petDrag = null;
let suppressPetClick = false;

function openPetMenu(open) {
  if (open) alignPetMenu();
  pet.classList.toggle("menu-open", open);
  petFigure.setAttribute("aria-expanded", String(open));
}

function alignPetMenu() {
  if (getComputedStyle(pet).display === "none") return;
  const rect = pet.getBoundingClientRect();
  const width = petActions.offsetWidth;
  const centered = rect.left + rect.width / 2 - width / 2;
  const safe = Math.max(8, Math.min(centered, innerWidth - width - 8));
  petActions.style.setProperty("--menu-shift", `${safe - centered}px`);
}

function petSpark(symbol) {
  for (let i = 0; i < 4; i++) {
    const spark = document.createElement("span");
    spark.className = "pet-spark";
    spark.textContent = symbol;
    spark.style.setProperty("--drift", `${(i - 1.5) * 24}px`);
    spark.style.animationDelay = `${i * 80}ms`;
    pet.appendChild(spark);
    setTimeout(() => spark.remove(), 1600);
  }
}

function playPetAction(action) {
  const reaction = petReactions[action];
  if (!reaction) return;
  petSpeech.textContent = reaction.line;
  pet.classList.remove(...petMotions);
  void pet.offsetWidth;
  pet.classList.add(reaction.motion);
  petSpark(reaction.spark);
  clearTimeout(petMotionTimer);
  petMotionTimer = setTimeout(() => pet.classList.remove(...petMotions), reaction.duration);
}

function placePet(x, y) {
  const maxX = Math.max(8, innerWidth - pet.offsetWidth - 8);
  const maxY = Math.max(44, innerHeight - pet.offsetHeight - 8);
  pet.style.right = "auto";
  pet.style.bottom = "auto";
  pet.style.left = `${Math.max(8, Math.min(x, maxX))}px`;
  pet.style.top = `${Math.max(44, Math.min(y, maxY))}px`;
  alignPetMenu();
}

function keepPetInView() {
  if (!pet.style.left || getComputedStyle(pet).display === "none") return;
  placePet(parseFloat(pet.style.left), parseFloat(pet.style.top));
}

function resetPetPosition() {
  pet.style.removeProperty("left");
  pet.style.removeProperty("top");
  pet.style.removeProperty("right");
  pet.style.removeProperty("bottom");
  localStorage.removeItem("agent.pet.position");
  alignPetMenu();
  playPetAction("pet");
  petSpeech.textContent = "回到右下角啦～";
}

try {
  const savedPosition = JSON.parse(localStorage.getItem("agent.pet.position") || "null");
  if (Number.isFinite(savedPosition?.x) && Number.isFinite(savedPosition?.y)) {
    pet.style.right = "auto";
    pet.style.bottom = "auto";
    pet.style.left = `${savedPosition.x}px`;
    pet.style.top = `${savedPosition.y}px`;
    requestAnimationFrame(keepPetInView);
  }
} catch (_) { /* 旧位置无效时回到默认右下角 */ }
petFigure.querySelector("img").addEventListener("load", keepPetInView);
window.addEventListener("resize", () => { keepPetInView(); alignPetMenu(); });
themeSelect.addEventListener("change", () => requestAnimationFrame(keepPetInView));

function showPet(visible) {
  pet.hidden = !visible;
  petToggle.textContent = visible ? "收起小鲸" : "召唤小鲸";
  petToggle.setAttribute("aria-expanded", String(visible));
  localStorage.setItem("agent.pet.visible", String(visible));
  if (!visible) openPetMenu(false);
  else requestAnimationFrame(() => { keepPetInView(); alignPetMenu(); });
}
showPet(localStorage.getItem("agent.pet.visible") !== "false");
petToggle.addEventListener("click", () => showPet(pet.hidden));
petActions.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-pet-action]");
  if (!button) return;
  if (button.dataset.petAction === "home") resetPetPosition();
  else playPetAction(button.dataset.petAction);
});
petFigure.addEventListener("click", () => {
  if (suppressPetClick) return;
  openPetMenu(true);
  playPetAction("pet");
});
petFigure.addEventListener("pointerdown", (event) => {
  if (event.button !== 0) return;
  const rect = pet.getBoundingClientRect();
  petDrag = {id: event.pointerId, x: event.clientX, y: event.clientY,
    left: rect.left, top: rect.top, moved: false};
  petFigure.setPointerCapture(event.pointerId);
});
petFigure.addEventListener("pointermove", (event) => {
  if (!petDrag || event.pointerId !== petDrag.id) return;
  const dx = event.clientX - petDrag.x;
  const dy = event.clientY - petDrag.y;
  if (!petDrag.moved && Math.hypot(dx, dy) < 6) return;
  petDrag.moved = true;
  pet.classList.add("dragging");
  openPetMenu(false);
  placePet(petDrag.left + dx, petDrag.top + dy);
  event.preventDefault();
});
function finishPetDrag(event) {
  if (!petDrag || event.pointerId !== petDrag.id) return;
  if (petDrag.moved) {
    suppressPetClick = true;
    localStorage.setItem("agent.pet.position", JSON.stringify({
      x: parseFloat(pet.style.left), y: parseFloat(pet.style.top)
    }));
    setTimeout(() => { suppressPetClick = false; }, 0);
  }
  petDrag = null;
  pet.classList.remove("dragging");
}
petFigure.addEventListener("pointerup", finishPetDrag);
petFigure.addEventListener("pointercancel", finishPetDrag);
document.addEventListener("pointerdown", (event) => {
  if (!pet.contains(event.target)) openPetMenu(false);
});

let turn = null;

// ---- 会话状态 ----
let SESSIONS = [];       // 侧栏那份列表(服务端给的)
let current = null;      // 屏幕上是哪个会话
let lastSeq = 0;         // 这个会话已经画到哪条事件 —— 库给的游标,只增
let ownsStream = false;  // 本页是不是那一轮直播流的持有者
let poller = null;       // 轮询定时器
let screenBuilt = false; // 这个会话的屏幕建起来了吗(轮次框都在、lastSeq 是服务端给的)
let composerOn = null;   // 输入框上一刻的状态,用来只在"重新可用"时抢焦点
let TURNS = new Map();   // turn_id -> 那一轮的 <section>,已经画在屏幕上的
let SINK = null;         // 新容器挂哪:null = stream;重放旧版记录时是那块区域

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

// 贴不贴底是个**状态**,不是每次现算的距离。
//
// 原来那版每次拿"离底不到 120px"当判据,默认内容是一小口一小口来的。
// 可流式输出里常有一步顶好几行的时候(一整段话、一张图、一个代码块),
// 一步就跨出 120px:这一跨之后离底永远是">120px",于是再也追不上,
// 屏幕上就停在半空 —— 而且停在那儿不动,看着像"新消息被遮住了"。
//
// 所以:自己的滚动动作决定 stick(滚上去就松开,滚回底就重新贴上),
// 贴住之后不管内容一次涨多少都跟到底。force = true 是"自己发的话"这一类:
// 主动发言就是要看结果,不管你刚才翻到哪,直接贴回去。
let stick = true;

function maxScroll() { return log.scrollHeight - log.clientHeight; }
function nearBottom() { return maxScroll() - log.scrollTop < 120; }

function follow(force) {
  if (force) stick = true;
  if (!stick) return;
  log.scrollTop = log.scrollHeight;   // 超了会自动夹到 max,不用自己减
}

// 只有**人**滚的时候才改 stick。程序自己滚也会发 scroll 事件,但那时的
// 位置必然就在底部,算出来还是 true,所以不用去区分是谁滚的。
log.addEventListener("scroll", () => { stick = nearBottom(); }, { passive: true });

// 两个不经过 add() 的变高:内容自己撑高(图片加载完、<details> 展开、
// 排版重算),和视口自己变矮(输入框跟着字长高,把日志挤短)。
// 这两种都会把底部推出可视区,而事件里没有任何一次 add() 来管。
// 贴着底就补一下,松开了就什么都不做。
new ResizeObserver(() => follow()).observe(log);
new ResizeObserver(() => follow()).observe(stream);

function add(node, target) {
  (target || turn || stream).appendChild(node);
  follow();
}

// ---- 轮次 ----
//
// 屏幕上一条轮次就是一个 <section class="turn">,里面是抬头(轮号 + 状态)
// 加这一轮的内容。三种来源都往同一个盒子里放,靠 turn_id 认:
//
//   直播流    这一轮正在跑,事件一条条来
//   轮询      页面上没有那条 POST 流时(刷新过、或者轮是别的标签页起的)
//   轮次接口  切会话/刷新时,一次性把这一轮已有的消息全读出来
//
// 只有第三个是从库里重建的,前两个是过程。两者靠事件游标 cursor 划清界限,
// 见 loadTurns。

const STATE_TEXT = { running: "运行中", completed: "完成", failed: "失败",
                     unsaved: "未入库" };

function turnBox(id, no) {
  let box = TURNS.get(id);
  if (box) return box;
  box = el("section", "turn");
  const head = el("header", "thead");
  head.appendChild(el("span", "no", no == null ? "一轮" : "第 " + no + " 轮"));
  head.appendChild(el("span", "state"));
  box.appendChild(head);
  TURNS.set(id, box);
  stream.appendChild(box);
  // 先按"运行中"摆上。直播那一路到这儿就是对的(事件来的时候这一轮确实
  // 在跑);从轮次接口读出来的那一路紧接着会用库里的真状态盖掉它。
  setState(id, "running");
  return box;
}

function setState(id, status, error) {
  const box = TURNS.get(id);
  if (!box) return;
  box.dataset.status = status;
  const label = box.querySelector(".thead .state");
  if (label) {
    label.textContent = STATE_TEXT[status] || status;
    label.title = error || "";
  }
}

// 一轮的花费小结。line 是服务端渲染好的那一行(usage.turn_line),空就不画 ——
// 没记到账的时候返回 null,页面这边不该编一个 "¥0" 出来。
//
// **每次都重新 append,不是只在新建时 append。** 这一步是有讲究的:直播那
// 一路里,这一行的到达(一轮结束时)和后面消息的到达可能交错,而
// appendChild 对已经在树上的节点是"挪到末尾" —— 于是不管谁先谁后,它永远
// 待在正文下面。靠"只建一次"的话,下一片碎片就会把它顶到上面去。
function setUsage(id, line) {
  const box = TURNS.get(id);
  if (!box || !line) return;
  let foot = box.querySelector(".tfoot");
  if (!foot) foot = el("footer", "tfoot");
  foot.textContent = line;
  box.appendChild(foot);
}

// 没有 turn_id 的那些事件(旧版记录)走这条路:每次 you 现开一个容器,
// 跟以前一样。它们进了 SINK 指定的那块区域,不是直接挂在正文流上。
function newSection() {
  const section = el("section", "turn");
  (SINK || stream).appendChild(section);
  return section;
}

// 旧版记录:这一版之前留下的会话没有轮次,只有一串事件。它们照旧走
// 重放那条路 —— 那会儿没有 turn_messages 可读,不重放就什么都看不见。
//
// 不编号:那时候的"轮"没有落过库,编出来的号是假的。
async function loadLegacy(sid) {
  let events;
  try {
    const r = await fetch(API + "/session/" + sid + "/events?since=0&legacy=1");
    if (!r.ok) return;
    events = (await r.json()).events;
  } catch { return; }
  if (!events.length) return;

  const box = el("section", "legacy");
  box.appendChild(el("header", "lhead", "旧版记录(轮次落库之前)"));
  stream.appendChild(box);

  SINK = box;
  turn = null;
  call = null;
  // 空白屏上的一次性全量重放,不会重复,不用过 renderIfNew 那层去重
  for (const ev of events) render(ev);
  SINK = null;

  // 游标推到这批旧事件之后。不推的话,万一接下来 loadTurns 没拿到数据
  // (它负责把游标设成服务端给的那个),catchUp 会从 0 重拉一遍 —— 于是
  // 同一批旧记录被画两遍:一遍在这块区域里,一遍散在正文流上。
  lastSeq = Math.max(lastSeq, ...events.map((e) => e.seq || 0));
}

// 切会话/刷新时重建轮次。画的是 turn_messages(原始消息),不是事件重放 ——
// 两边都画就得写一套"这条事件对应哪条消息"的去重规则,而那种规则迟早会漏。
//
// 返回"建起来了没有":pollTick 要靠它判断"要不要整个重建"。这里失败是静默
// return 的(后端不在而已),所以只能由返回值说出去,不能靠调用方猜。
async function loadTurns(sid) {
  let data;
  try {
    const r = await fetch(API + "/session/" + sid + "/turns");
    if (!r.ok) return false;
    data = await r.json();
  } catch { return false; }

  for (const t of data.turns) renderTurn(t);

  // cursor 是"截到哪条事件为止",跟上面那份 turns 读自同一个快照。
  // 设成它,后面的直播和轮询就只画新事件 —— 已经画过的不再画一遍。
  lastSeq = data.cursor || 0;

  // 挂起中的确认单独补:它不是一条消息,库里没有,而游标已经越过它了 ——
  // 不补这一下,刷新之后页面上没有那个按钮,而 agent 那头正挂在那儿等
  // 300 秒超时。别的直播事件都能从消息重建,或者丢了也无所谓。
  for (const ask of data.pending || []) {
    if (ask.turn_id) turn = turnBox(ask.turn_id, null);
    add(renderAsk(ask));
  }
  return true;
}

function blocksOf(content) {
  if (typeof content === "string") return [{ type: "text", text: content }];
  return Array.isArray(content) ? content : [];
}

function blockText(content) {
  return blocksOf(content).map((b) => b.text || b.content || "").join("");
}

// 折叠着的那些块(工具输出、推理)都拿它当摘要 —— 两三行、一百来字,
// 不展开也知道里面是什么。
function headline(text) {
  return String(text).trim().split("\n").filter((l) => l.trim())
               .slice(0, 2).join(" / ").slice(0, 140);
}

// 参数一行放不下就做成可展开的。120 是按屏幕量的:12.5px 等宽一行大约放得下
// 百来个字符,再往上就是被 CSS 截掉了 —— 截掉的是显示,数据一直在,所以给它
// 一个展开的口子。
const ARGS_INLINE_MAX = 120;

// 工具调用那一行。**重放和直播两条路都得走这儿。**
//
// 短的一行到底;长的包成 details.args:折叠时还是那一行(截断交给 CSS),
// 展开给格式化过的 JSON —— edit_file 那种带 old_string / new_string 的,
// 一行读不了,格式化了才叫看完整。
//
// 这个函数只画参数那一块,返回的 .call 是给调用方接着挂工具输出用的
// (见下面 tool_result 那一段)。两条路各画一遍的话,下次改一处漏一处,
// 而漏的会是直播那条 —— 重放看着是对的。
function renderToolCall(name, input) {
  const call = el("div", "call");
  const json = JSON.stringify(input);

  const row = el("div", "tool");
  row.appendChild(el("span", "name", name));
  row.appendChild(el("span", "args", json));
  if (json.length <= ARGS_INLINE_MAX) {
    call.appendChild(row);
    return call;
  }

  const d = document.createElement("details");
  d.className = "args";
  const summary = document.createElement("summary");
  summary.className = "tool";
  for (const node of [...row.childNodes]) summary.appendChild(node);
  d.appendChild(summary);
  d.appendChild(el("pre", null, JSON.stringify(input, null, 2)));
  call.appendChild(d);
  return call;
}

function renderTurn(t) {
  const box = turnBox(t.id, t.turn_no);
  setState(t.id, t.status, t.error_message);

  // 一条 assistant 消息里可以有好几个 tool_use,结果散在后面那条消息里。
  // 拿 tool_use_id 找回去:名字和参数在调用那头,输出在结果那头。
  const calls = new Map();
  for (const m of t.messages) renderMessage(box, m, calls);

  if (t.status === "failed" && t.error_message) {
    box.appendChild(el("div", "error", t.error_message));
  }
  // 保存失败的那一轮,库里还停在 running(终态那次写没成功)——光看库里的
  // 状态,刷新之后页面只会显示"运行中",而真相是它已经跑完、只是没存上。
  // 那一轮到底跑成什么样、为什么没存上,只有服务端内存里那份记录知道。
  if (t.unsaved) {
    setState(t.id, "unsaved", t.error_message);
    box.appendChild(saveFailureBox({ model_status: t.unsaved.model_status,
                                     save_error: t.unsaved.error }));
  }
  setUsage(t.id, t.usage);
  follow();
}

function renderMessage(box, m, calls) {
  // 用户说的话按原文显示,不过 markdown —— 他打的是什么就是什么。
  if (m.kind === "user_input") {
    box.appendChild(el("div", "you", String(m.content)));
    return;
  }
  // Stop hook 塞回来的话、每隔三轮的 todo 提醒、一次权限确认的结果。
  // 都是协议里的东西、不是对话内容 —— 一行旁注,别跟回复混在一起。
  // 不额外加前缀:每条自己就带了来路("［permission］ ..." 那种)。
  if (m.kind === "control") {
    box.appendChild(el("div", "note", headline(blockText(m.content))));
    return;
  }

  for (const b of blocksOf(m.content)) {
    switch (b.type) {
      case "text":
        if (b.text) box.appendChild(renderReply(b.text));
        break;
      case "thinking":
        // 库里的块叫 thinking,而 renderThinking 收的是事件(text)。转一道
        // 就行 —— 而且从这儿来的这份是**完整**的,直播那条是截断版。
        if ((b.thinking || "").trim()) box.appendChild(renderThinking({ text: b.thinking }));
        break;
      case "tool_use": {
        const call = renderToolCall(b.name, b.input);
        calls.set(b.id, call);
        box.appendChild(call);
        break;
      }
      case "tool_result": {
        const out = blockText(b.content);
        const d = document.createElement("details");
        d.className = "result";
        d.appendChild(el("summary", null, headline(out) || "(没有输出)"));
        d.appendChild(el("pre", null, out));
        // 找不到对应的调用就挂在轮上,别丢 —— 丢了的后果是这条输出
        // 在页面上消失,而它在这一轮的记录里明明是在的。
        (calls.get(b.tool_use_id) || box).appendChild(d);
        break;
      }
    }
  }
}

// ---- 会话 ----
//
// 切会话一律走"清空 + 从库里重放",不给每个会话留一份 DOM。留 DOM 意味着
// stream / log / turn / call 全要变成 per-session(连滚动位置一起),而收益
// 只是省一次重放。重放这条路同时还覆盖了刷新页面 —— 一套代码管两种入口。

function when(ts) {
  const s = Math.max(0, Date.now() / 1000 - ts);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分";
  if (s < 86400) return Math.floor(s / 3600) + " 时";
  return Math.floor(s / 86400) + " 天";
}

function paintSessions() {
  list.replaceChildren();
  for (const s of SESSIONS) {
    const row = el("div", "row");

    const item = el("button", "sess");
    item.type = "button";
    if (s.id === current) item.setAttribute("aria-current", "true");
    item.appendChild(el("span", "t", s.title || "新会话"));
    if (s.running || s.waiting) {
      const dot = el("span", "dot" + (s.waiting ? " wait" : ""));
      dot.title = s.waiting ? "在等你回答" : "在跑";
      item.appendChild(dot);
    }
    item.appendChild(el("span", "when", when(s.updated_at)));
    item.onclick = () => { if (s.id !== current) switchTo(s.id); };
    row.appendChild(item);

    // 删除是兄弟节点,不是嵌在 .sess 里 —— 按钮里套按钮是无效 HTML,
    // 浏览器会把它挪走,点击行为变得莫名其妙。
    const kill = el("button", "kill", "×");
    kill.type = "button";
    kill.title = "删除这个会话";
    kill.onclick = () => removeSession(s.id);
    row.appendChild(kill);

    list.appendChild(row);
  }
}

async function refreshSessions() {
  let sessions;
  try {
    sessions = (await (await fetch(API + "/sessions")).json()).sessions;
  } catch {
    return;   // 后端暂时不在。这里弹错只会刷屏,下次刷新会补上
  }
  SESSIONS = sessions;
  paintSessions();
  setHeader(sessions.some(s => s.running), sessions.some(s => s.waiting));
}

// 侧栏那两个点(在跑 / 在等你回答)是**服务端**的状态,不主动问就不知道。
// 而事件正好告诉我们它什么时候变:you = 这一轮开始了,ask = 有人在等你 ——
// 权限确认和 ask 工具的问题都是这一条事件,侧栏不用分。
//
// 合并一下再发:重放一个长会话时 you/ask 会连着来一串,不合并就是一串
// 请求 —— 而且它们说的是同一件事(侧栏现在长什么样)。
let refreshTimer = null;
function refreshSessionsSoon() {
  if (refreshTimer) return;
  refreshTimer = setTimeout(() => { refreshTimer = null; refreshSessions(); }, 200);
}

// 同一条事件可能从两条路来(直播流、切回来时的重放或轮询),两边各画一次
// 就重复了。seq 是库给的、只增,画过的不再画 —— 于是"谁先到"不重要了,
// 不用在两边各写一套状态机。
function renderIfNew(ev) {
  if (typeof ev.seq === "number") {
    if (ev.seq <= lastSeq) return;
    lastSeq = ev.seq;
  }
  render(ev);
}

// 直播流的每一条都从这儿过:只有它正好是屏幕上那个会话才画。
//
// 切走了就丢掉不画 —— 事件已经在库里了,切回来时重放会补上。
//
// 但**绝不能**用 reader.cancel() 去"清理"它:取消 = 关连接 = 服务端下一次
// 写抛 OSError = 提问器收到"没人能回答" = 一个正在等你的问题被悄悄处理掉
// (权限确认按拒绝走,ask 工具那边回一句"没人答上")。看起来像个无害的清理
// 动作,代价是把权限那道门拆了。
function feed(sid, ev) {
  if (sid === current) renderIfNew(ev);
}

// 问一次后端:这个会话在跑吗?
//
// **三种结果,别把后两种混成一个**:
//   true   在跑
//   false  没在跑 —— 后端说了话,而它说没有
//   null   **没问到** —— 传输失败、5xx、回的 JSON 坏了
//
// "没问到"和"没在跑"要的反应正好相反:前者必须继续盯着(后端一回来就接上),
// 后者才是收工。把它当 false,后端一重启页面就以为轮次结束了;当成 true,又
// 永远转圈。所以这个函数**绝不抛**:抛出去的话调用方(轮询、收尾)会各自在
// 不同的地方断掉,而它们都需要拿到这个三态。
//
// 404 算 false:那是"这个会话被删了"(removeSession 那条路,别的标签页也能删),
// 不是连不上。当 null 的话,后端明明活得好好的,页面却会一直转圈并说够不着。
async function catchUp() {
  if (!current) return false;
  let r;
  try {
    r = await fetch(API + "/session/" + current + "/events?since=" + lastSeq);
  } catch {
    return null;
  }
  if (r.status === 404) return false;
  if (!r.ok) return null;
  let data;
  try {
    data = await r.json();
  } catch {
    return null;
  }
  for (const ev of data.events) renderIfNew(ev);
  setComposer(!data.running);
  return data.running;
}

// 轮询的一拍,也是"收尾那一拍"。**两条路必须走同一个函数** —— 这是这次修的东西:
// 以前轮询只在 catchUp 的成功路径里被启动,而收尾那一下不经过它,于是"后端重启"
// 时收尾抛出、轮询没起、输入框永远停在"运行中…",只能手动刷新。
async function pollTick() {
  if (!current) { stopPolling(); return; }
  // 屏幕还没建起来(切会话时后端正好不在,loadTurns 静默失败了),而后端现在
  // 回来了:得整个重建,不能补增量 —— lastSeq 还停在 0,补增量会把这一会话的
  // 全部事件当散牌重画一遍(同一批东西画两遍,一遍在轮次框里、一遍散在流上)。
  if (!screenBuilt && !ownsStream) {
    const back = await pingBackend();
    setLink(back);
    if (back) { await switchTo(current); return; }
    startPolling();
    return;
  }
  const state = await catchUp();
  setLink(state !== null);
  if (state === false) {
    stopPolling();
    if (!ownsStream) settleDeadTurn();
  } else {
    startPolling();           // true 和 null 都盯着:null 要等它回来
  }
  refreshSessionsSoon();
}

// 后端还在吗?只看这一件事,不碰任何渲染状态。
async function pingBackend() {
  try {
    return (await fetch(API + "/sessions")).ok;
  } catch {
    return false;
  }
}

// 够不着后端的**那一刻/那一段**在页面上留痕。
//
// 为什么要一个独立的变量而不是从 catchUp 的返回值反推:这次事故的第一次翻转
// 是 true→null(直播流断在半路),照"false→null 才提示"的字面写法正好漏掉。
//
// 每次翻转各打一条,不是每拍一条 —— 一次重启该看见两条,不是两条乘上它持续了
// 多少秒。提示落在 stream 上(显式指定):不指定的话它会掉进当前那个轮次框里。
//
// 顶栏那个点是这里管的。`#hint` 平时是 setComposer 的地盘,唯一该由这里写的
// 就是"刚够不着"那一刻:从那以后 setComposer 不再被调到(它只在问到的路上),
// 而 hint 上会一直留着一句"运行中…" —— 够不着的时候那句话是假的。
let linkUp = true;
function setLink(up) {
  head.classList.toggle("down", !up);
  if (!up) hint.textContent = "连不上后端…";
  if (up === linkUp) return;
  linkUp = up;
  add(el("div", "note", up
    ? "[连接] 后端回来了,接着往下走"
    : "[连接] 够不着后端了(重启?)。这边不停,它回来会自动接上"), stream);
}

// 一个还在"运行中"的轮次框,而服务端已经明确说这个会话没在跑了 —— 那就是
// 进程被杀时留下的那一轮。它那句 reply 根本没发出来(reply 是这一轮最后才发的,
// 见 server.py 的 _run_turn),所以光靠补事件补不上这个状态。
//
// 启动时的 reap 只管得住**刷新之后**的页面;活着的页面是从轮次接口读 status 的,
// 不刷新就一直是"运行中"。而不刷新才是常态 —— 页面本来就不该逼人刷新。
//
// 靠 box.dataset.status 自己就是不重复的:settle 过的那一轮已经不是 running 了,
// 下一拍再扫到它会跳过。所以这个函数可以在轮询里每拍调。
const DEAD_TURN = "进程重启,这一轮没有跑完";

function settleDeadTurn() {
  for (const [id, box] of TURNS) {
    if (box.dataset.status !== "running") continue;
    setState(id, "failed", DEAD_TURN);
    add(el("div", "error", DEAD_TURN), box);
  }
}

// 只在"当前会话在跑、或者够不着后端"时才转。
//
// 注释里的"在跑"要理解成 pollTick 的三态:false 才停,null(够不着)也得接着转
// —— 后端回来是**下一次问它**才知道的,没人问就永远不知道。
//
// 藏着不转(document.hidden):切回来看的那一眼最多晚 1.5 秒,不值得为它多写一套。
function startPolling() {
  if (poller) return;
  poller = setInterval(async () => {
    if (document.hidden) return;
    await pollTick();
  }, 1500);
}

function stopPolling() {
  if (poller) { clearInterval(poller); poller = null; }
}

function blankScreen() {
  stream.replaceChildren();     // 一块清掉,比逐条摘干净
  turn = null;
  call = null;
  lastSeq = 0;
  TURNS = new Map();            // 屏幕清空了,那些盒子的引用也跟着作废
  SINK = null;
  screenBuilt = false;
}

async function switchTo(sid) {
  current = sid;
  localStorage.setItem("agent.session", sid);
  stopPolling();
  blankScreen();
  paintSessions();              // 选中态立刻生效,不等网络
  // 顺序要的:旧版记录先画,轮次后画 —— 它们本来就是"旧的在上、新的
  // 在下",而 DOM 里谁先挂进去谁在上面。
  await loadLegacy(sid);
  if (sid !== current) return;  // 这几下都是网络往返,人可能已经点去别的会话了
  // loadTurns 的返回值就是"屏幕建起来了没有":它成功时 lastSeq 已经被推到服务端
  // 给的游标,轮次框也都挂上了。后端不在时它静默返回 false,这时屏幕是空的而
  // lastSeq 还是 0 —— 后面 pollTick 会认这个标志,等后端回来整个重建。
  screenBuilt = await loadTurns(sid);
  if (sid !== current) return;
  await pollTick();             // 收尾这一拍:问不着也得把轮询接上,见 pollTick
  refreshSessions();
}

async function newSession() {
  let id;
  try {
    const r = await fetch(API + "/session", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
    id = (await r.json()).id;
  } catch (err) {
    add(el("div", "error", "建会话失败: " + err));
    return;
  }
  SESSIONS = [{ id, title: "", updated_at: Date.now() / 1000,
                running: false, waiting: false }, ...SESSIONS];
  current = id;
  localStorage.setItem("agent.session", id);
  stopPolling();
  blankScreen();
  // 新建的会话本来就什么都没有,空屏就是它正确的样子 —— 所以这才是"屏幕建好了"。
  // 不认这个的话,下面那一轮收尾时 pollTick 会以为屏幕没建起来,反手重建一次:
  // 内容一样(都是从库里画的),但是白跑一趟,而且屏幕会闪一下。
  screenBuilt = true;
  paintSessions();
  setComposer(true);
}

async function removeSession(sid) {
  let r;
  try {
    r = await fetch(API + "/session/" + sid + "/delete", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: "{}",
    });
  } catch {
    // 后端不在。这次点击就是什么都没发生 —— 说一声,别让人对着没反应的按钮猜。
    // (删除是点一次发生一次的事,不会刷屏,所以不必像轮询那样只在翻转时说话。)
    add(el("div", "note", "[连接] 后端不在了,这次删除没送到。等它回来再删一次"), stream);
    return;
  }
  if (!r.ok) {
    add(el("div", "error", "没删掉: 后端 " + r.status +
        (r.status === 409 ? "(这一轮还在跑)" : "")));
    return;
  }
  SESSIONS = SESSIONS.filter(s => s.id !== sid);
  if (sid !== current) { paintSessions(); return; }

  current = null;
  localStorage.removeItem("agent.session");
  stopPolling();
  blankScreen();
  if (SESSIONS.length) await switchTo(SESSIONS[0].id);
  else { paintSessions(); setComposer(true); }
}

// ---- markdown → DOM ----
//
// 全程 createElement / createTextNode,一个 innerHTML 都不用。这不是洁癖,
// 是这次改动唯一的安全约束:模型读过的文件内容会进回复,那是不受信的。
// 走 innerHTML 的话,文件里写一句 <img onerror=...> 就能在页面里跑 JS,
// 而页面跟后端同源 —— 那段 JS 反过来能 POST /answer 替你把权限批了。
// 造节点这条路上,"注入"在结构上就不可能,连转义函数都不需要。
//
// 不管的:图片、内联 HTML(故意的,理由见上)、setext 标题、引用式链接、
// 脚注。够用就行,不够再加。

// 这一组是"块的起手式"。dispatch 和 startsBlock 必须用同一组 —— 两处改岔了
// 就是一个吃不到行的死循环,见下面段落那段。
const FENCE   = /^```\S*\s*$/;
const RULE    = /^\s*([-*_])\s*(\1\s*){2,}$/;
const HEADING = /^(#{1,6})\s+(.*)$/;
const QUOTE   = /^\s*>/;
const ITEM    = /^(\s*)([-*+]|\d{1,3}[.)])\s+(.*)$/;

function splitRow(line) {
  let s = line.trim();
  if (s.startsWith("|")) s = s.slice(1);
  if (s.endsWith("|")) s = s.slice(0, -1);
  return s.split("|").map((cell) => cell.trim());
}

// 分隔行:每个格子都是 --- 、:--- 、---: 或 :---: ,只管对齐和划线。
function isSeparatorRow(line) {
  return splitRow(line).every((cell) => /^:?-+:?$/.test(cell));
}

// 表格跟上面几个块不一样:它得**看下一行**才知道自己是不是表格。
//
// 判据是两个一起用:这一行有竖线,且下一行是分隔行,**且两边格子数一样**
// (GFM 本来就这么要求)。只认竖线的话,正文里一句 "a | b" 会变成表格;
// 只认"下一行是分隔行"的话,"---" 只是一条分割线。
function startsTable(lines, i) {
  if (i + 1 >= lines.length || !lines[i].includes("|")) return false;
  return isSeparatorRow(lines[i + 1]) &&
         splitRow(lines[i]).length === splitRow(lines[i + 1]).length;
}

function startsBlock(lines, i) {
  const line = lines[i];
  return FENCE.test(line) || RULE.test(line) || HEADING.test(line) ||
         QUOTE.test(line) || ITEM.test(line) || startsTable(lines, i);
}

// 行内。分支顺序就是优先级:行内代码排最前,否则 `a**b**c` 里的星号会被
// 当成粗体。
//
// 每次调用现造一个正则:正则对象带 lastIndex 状态,而这个函数会递归
// (粗体里面还能有行内代码)—— 共用一个的话,内层扫描会把外层的进度冲掉。
const inlineRe = () =>
  /(`[^`\n]+`)|(\*\*[^*\n]+\*\*)|(__[^_\n]+__)|(\*[^*\n]+\*)|(_[^_\n]+_)|(\[[^\]\n]*\]\([^)\n]+\))/g;

function safeHref(url) {
  // 只认 http/https。javascript: 和 data: 能让 <a href> 变成执行入口,
  // 而这段文字来自模型,模型又是从文件和网页里读来的。
  try {
    const u = new URL(url, location.href);
    return /^https?:$/.test(u.protocol) ? u.href : null;
  } catch {
    return null;
  }
}

function inline(text, parent) {
  const re = inlineRe();
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) {
      parent.appendChild(document.createTextNode(text.slice(last, m.index)));
    }
    const tok = m[0];
    if (tok[0] === "`") {
      parent.appendChild(el("code", "ic", tok.slice(1, -1)));
    } else if (tok.startsWith("**") || tok.startsWith("__")) {
      const s = el("strong", null, "");
      inline(tok.slice(2, -2), s);
      parent.appendChild(s);
    } else if (tok[0] === "*" || tok[0] === "_") {
      const e = el("em", null, "");
      inline(tok.slice(1, -1), e);
      parent.appendChild(e);
    } else {
      const mm = /^\[([^\]]*)\]\(([^)]+)\)$/.exec(tok);
      const href = safeHref(mm[2]);
      if (!href) {
        // 不是 http/https,原样显示 —— 不给它变成链接的机会,也不吞掉,
        // 免得看起来像内容丢了。
        parent.appendChild(document.createTextNode(tok));
      } else {
        const a = el("a", null, "");
        a.href = href;
        a.target = "_blank";
        a.rel = "noreferrer noopener";
        inline(mm[1], a);
        parent.appendChild(a);
      }
    }
    last = re.lastIndex;
  }
  if (last < text.length) {
    parent.appendChild(document.createTextNode(text.slice(last)));
  }
}

function renderList(lines, i, parent) {
  const flat = (s) => s.replace(/\t/g, "    ");

  // 先把整段列表行收下来。续行(缩进比当前项更深的非列表行)并进上一项,
  // 否则"1. 标题\n   继续说明"会被拆成列表后面跟一个孤立段落。
  const items = [];
  while (i < lines.length) {
    const m = ITEM.exec(lines[i]);
    if (m) {
      items.push({ indent: flat(m[1]).length,
                   ordered: /\d/.test(m[2]),
                   text: m[3] });
      i++;
      continue;
    }
    const prev = items[items.length - 1];
    if (prev && lines[i].trim() && /^\s/.test(lines[i]) &&
        flat(lines[i]).match(/^\s*/)[0].length > prev.indent) {
      prev.text += " " + lines[i].trim();
      i++;
      continue;
    }
    break;
  }
  if (!items.length) return i;

  // 拿缩进当层级:变深就开子列表挂在上一项的 <li> 底下,变浅就弹回去。
  // 比数空格更好使的是栈 —— 一次遍历,不用递归。
  const root = document.createElement(items[0].ordered ? "ol" : "ul");
  parent.appendChild(root);
  const stack = [{ indent: items[0].indent, node: root, li: null }];

  for (const it of items) {
    while (stack.length > 1 && it.indent < stack[stack.length - 1].indent) {
      stack.pop();
    }
    let top = stack[stack.length - 1];
    if (it.indent > top.indent) {
      const sub = document.createElement(it.ordered ? "ol" : "ul");
      (top.li || top.node).appendChild(sub);
      top = { indent: it.indent, node: sub, li: null };
      stack.push(top);
    }
    const li = document.createElement("li");
    inline(it.text, li);
    top.node.appendChild(li);
    top.li = li;          // 供下一行开子列表时挂靠
  }
  return i;
}

function renderTable(lines, i, parent) {
  const head = splitRow(lines[i]);
  // 对齐来自分隔行:`:---` 左、`---:` 右、`:---:` 居中、`---` 不管。
  const aligns = splitRow(lines[i + 1]).map((cell) => {
    if (cell.startsWith(":") && cell.endsWith(":")) return "center";
    if (cell.endsWith(":")) return "right";
    if (cell.startsWith(":")) return "left";
    return "";
  });
  i += 2;

  // 表体吃到"不再是表格行"为止。**按表头的列数补齐/截断**:模型偶尔会多写
  // 或少写一格,不管的话这一行会把整张表撑歪(HTML 会自己补 td,但补出来的
  // 位置跟对齐都是错的)。
  const rows = [];
  while (i < lines.length && lines[i].trim() && lines[i].includes("|")) {
    const cells = splitRow(lines[i++]);
    rows.push(head.map((_, c) => cells[c] || ""));
  }

  const table = document.createElement("table");
  const hrow = table.createTHead().insertRow();
  head.forEach((text, c) => {
    const th = document.createElement("th");
    th.style.textAlign = aligns[c] || "";
    inline(text, th);
    hrow.appendChild(th);
  });
  const tbody = table.createTBody();
  for (const cells of rows) {
    const tr = tbody.insertRow();
    cells.forEach((text, c) => {
      const td = document.createElement("td");
      td.style.textAlign = aligns[c] || "";
      inline(text, td);
      tr.appendChild(td);
    });
  }

  // 包一层可横向滚动的壳:宽表不该把整个页面撑出一条横向滚动条。
  const wrap = el("div", "tw");
  wrap.appendChild(table);
  parent.appendChild(wrap);
  return i;
}

function renderReply(text) {
  const wrap = el("div", "reply");
  // 先去掉 \r:回复里可能带 CRLF(模型读进来的 Windows 文件内容就会)。
  // 留着的话每个文本节点尾巴都挂一个 —— 浏览器当空白不显示,但它会混进
  // 段落拼接里,没必要带着。
  const lines = text.replace(/\r/g, "").split("\n");
  let i = 0;

  while (i < lines.length) {
    const line = lines[i];

    if (!line.trim()) { i++; continue; }

    if (FENCE.test(line)) {
      const body = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) body.push(lines[i++]);
      i++;                                   // 闭括号那行(没闭合就是收尾)
      wrap.appendChild(el("pre", "code", body.join("\n")));
      continue;
    }

    if (RULE.test(line)) {
      wrap.appendChild(el("hr"));
      i++;
      continue;
    }

    const h = HEADING.exec(line);
    if (h) {
      const node = el("h" + h[1].length, null, "");
      inline(h[2], node);
      wrap.appendChild(node);
      i++;
      continue;
    }

    if (QUOTE.test(line)) {
      const q = el("blockquote", null, "");
      let first = true;
      while (i < lines.length && QUOTE.test(lines[i])) {
        if (!first) q.appendChild(el("br"));
        inline(lines[i++].replace(/^\s*>\s?/, ""), q);
        first = false;
      }
      wrap.appendChild(q);
      continue;
    }

    if (startsTable(lines, i)) {
      i = renderTable(lines, i, wrap);
      continue;
    }

    if (ITEM.test(line)) {
      i = renderList(lines, i, wrap);
      continue;
    }

    // 段落。行间的换行留成 <br>:标准 markdown 会把它们并成空格,但模型输出
    // 的换行通常是有意的(路径、步骤一行一个),并掉反而难读。
    const p = el("p", null, "");
    let first = true;
    while (i < lines.length && lines[i].trim() && !startsBlock(lines, i)) {
      if (!first) p.appendChild(el("br"));
      inline(lines[i++], p);
      first = false;
    }
    // 上面那个判断跟外面的 dispatch 是同一组,第一行理论上必定进得了循环。
    // 但两处将来改岔了就是个 i 不动的死循环,所以兜一手:一行都没吃到,
    // 就把这行原样吐出去再前进 —— 保证每轮都有进展。
    if (first) p.appendChild(document.createTextNode(lines[i++]));
    wrap.appendChild(p);
  }

  if (!wrap.childNodes.length) wrap.appendChild(el("p", null, text));
  return wrap;
}

// 一次调用和它的输出要贴在一起 —— 事件是分两条来的,靠这个把结果接回
// 上一次调用底下。否则一屏工具的时候,根本看不出哪段输出属于哪次调用。
let call = null;

// 问题框。两种走同一个壳,靠 ev.mode 分:
//
//   "confirm"   权限确认 —— 允许 / 拒绝,发 { allow }
//   "question"  ask 工具 —— 输入框 + 可选按钮,发 { text }
//
// 拿不准的一律按 confirm 走:mode 是后加的字段,库里存着的旧事件没有它,
// 不默认的话重放老会话会画成一个填不了的问题框。
//
// 后端那条 /ask 流还开着,agent 线程正挂在上面等回答 —— 所以这个框点了
// 才有下文,不点就一直等(后端 300s 超时后往下走)。
function renderAsk(ev) {
  const mode = ev.mode === "question" ? "question" : "confirm";

  // live 是服务端查 PENDING 得出的:重放里出现的 ask **可能还活着** ——
  // 切走再切回来时那一轮还在跑,槽还在,点下去是真有用的。所以只有明确
  // false 才画成历史。直播流里的事件没有这个字段(它本来就是活的)。
  if (ev.live === false) {
    const done = el("div", "ask done");
    done.appendChild(el("div", "q", ev.question));
    done.appendChild(el("div", "settled", "（历史记录，已无法回答）"));
    return done;
  }

  const box = el("div", "ask");
  box.appendChild(el("div", "q", ev.question));
  const mark = el("span", "settled", "");

  // 点击之后所有能点的都禁掉,包括输入框 —— 一次点击就是一次回答,而
  // 后端那个槽只认第一次送到的。
  async function settle(body, verdict) {
    box.querySelectorAll("button, input").forEach((n) => { n.disabled = true; });
    box.classList.add("done");
    mark.textContent = verdict;
    hint.textContent = "运行中…";
    try {
      const r = await fetch(API + "/answer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ id: ev.id, ...body }),
      });
      // 409:后端已经超时清掉了那个槽,那一轮早就往下走了。
      // 400:空回答被拒(confirm 那边发的是 allow,不会撞上)。
      // 都不是错误,说一声就够 —— 别让人以为自己的点击生效了。
      if (!r.ok) mark.textContent = verdict + "(后端 " + r.status + ")";
    } catch (err) {
      // 送不到后端 = 那个槽会一直等到超时。后果是保守的那一侧,所以只
      // 提示,不用重试。
      add(el("div", "error", "回答没送到后端,这一轮会白等一场: " + err));
    }
  }

  if (mode === "question") {
    const opts = el("div", "opts");
    const row = el("div", "row");
    const input = el("input");
    input.placeholder = "或直接输入…";
    const send = () => {
      const text = input.value.trim();
      if (text) settle({ text }, "已送出");
    };

    for (const option of ev.options || []) {
      const b = el("button", null, option);
      // 按钮把**选项原文**发回去,不发下标 —— 下标是两边各存一半的约定,
      // 而它会漂,漂的时候不报错。选项在服务端已经压成一行、封了顶。
      b.onclick = () => settle({ text: option }, "已送出");
      opts.appendChild(b);
    }
    if (opts.children.length) box.appendChild(opts);

    const submit = el("button", "yes", "回答");
    submit.onclick = send;
    input.onkeydown = (e) => {
      if (e.key === "Enter") { e.preventDefault(); send(); }
    };
    row.append(input, submit, mark);
    box.appendChild(row);
    hint.textContent = "等待回答…";
    return box;
  }

  const row = el("div", "row");
  const yes = el("button", "yes", "允许");
  const no = el("button", "no", "拒绝");
  yes.onclick = () => settle({ allow: true }, "已允许");
  no.onclick = () => settle({ allow: false }, "已拒绝");
  row.append(yes, no, mark);
  box.appendChild(row);
  hint.textContent = "等待确认…";
  return box;
}

// 推理过程。默认收起:它是过程不是结论,跟工具输出同一档 —— 想知道就
// 展开,不想知道就别占着屏幕。标题给一小段预览,不用展开也能看出它在
// 想什么。
function renderThinking(ev) {
  const d = document.createElement("details");
  d.className = "think";
  // 摘要走 headline:它会先滤掉空行再取前两行。不滤的话,推理里那些
  // 空行会让预览留下一个孤零零的分隔符("第一行 / ")。
  d.appendChild(el("summary", null, headline(ev.text) || "推理过程"));
  d.appendChild(el("pre", null, ev.text));
  return d;
}

// ---- 正在流的那一块 ----
//
// 文字是一片片到的(服务端的 delta)。它们**不落库**,所以只可能从直播流
// 来,永远不会被重放 —— 那条去重规则对它们不适用,每一条都得往同一个
// 节点里追加。
//
// 键是"哪一轮的哪种块"。同一轮里会有好几个推理块(每次 API 调用一个),
// 所以完整的那条一到就把这块换掉、从表里删掉,下一片自然另起一块。
const LIVE = new Map();

function liveBlock(ev) {
  const key = (ev.turn_id || "?") + ":" + ev.target;
  const had = LIVE.get(key);
  if (had) return had;

  const thinking = ev.target === "thinking";
  const node = thinking ? document.createElement("details") : el("div");
  node.className = thinking ? "think live" : "reply live";
  // 推理那块是收起的,标题给个预览 —— 流的时候这行跟着长,不用展开
  // 也看得出它在想什么。正文块没有这层壳,字直接长在节点上。
  const body = thinking ? el("pre") : node;
  if (thinking) {
    node.appendChild(el("summary", null, "推理过程"));
    node.appendChild(body);
  }
  node.body = body;
  add(node);
  LIVE.set(key, node);
  return node;
}

function streamDelta(ev) {
  const node = liveBlock(ev);
  node.body.textContent += ev.text;
  if (ev.target === "thinking") {
    node.querySelector("summary").textContent =
      headline(node.body.textContent) || "推理过程";
  }
  follow();
}

// 完整的那条到了:把流着的那块换成权威的那份重画。
//
// 换掉而不是往里补,是因为流的字和最终的字可能不一样(比如 hook 又塞了话
// 接着说),能信的只有最终那条。找得到就换,找不到(刷新过、或者本来就是
// 从重放来的)就照老样子画一个新的。
function settleLive(turnId, target, fresh) {
  const key = (turnId || "?") + ":" + target;
  const node = LIVE.get(key);
  LIVE.delete(key);
  if (!node) return false;
  node.replaceWith(fresh);
  // 换完跟一次:纯文本换成排好版的成品,高度会变(段落间距、代码块、表格),
  // 不跟的话人在底部反而被留在半空 —— 而这一步才是"消息出来了"。
  follow();
  return true;
}

// 复制一段文字。页面是 127.0.0.1(http),算 secure context,clipboard 能用;
// 失败也得有人说话 —— 按钮自己变成"复制失败",而文字就在旁边,手动选也行。
function copyBtn(text, label) {
  const name = label || "复制";
  const b = el("button", "copy", name);
  b.type = "button";
  b.onclick = async () => {
    try {
      await navigator.clipboard.writeText(text);
      b.textContent = "已复制";
    } catch (err) {
      b.textContent = "复制失败(手动选中)";
    }
    setTimeout(() => { b.textContent = name; }, 1500);
  };
  return b;
}

// "执行结束了,但结果没存进库"。
//
// 为什么要单独一块红字,而不是照旧发一条"完成":库里那一轮**还停在 running**
// (终态那一次写就没成功),工作上下文也还是旧的 —— 下一轮会从旧的那份接着
// 跑。把它画成普通完成,用户就会以为可以放心接着聊。
function saveFailureBox(ev) {
  const box = el("div", "error");
  const what = STATE_TEXT[ev.model_status] || ev.model_status || "结束";
  box.appendChild(el("div", null,
    "执行已结束(" + what + "),但这一轮的结果没存进库:刷新会退回上一轮。" +
    (ev.save_error ? " " + ev.save_error : "")));
  // 这段文字可能没进库(记消息那条热路径和收尾那次写是两条,可能一起坏),
  // 页面上这份就是唯一一份 —— 所以给一个复制按钮。
  if (ev.text) box.appendChild(copyBtn(ev.text));
  return box;
}

function render(ev) {
  // 先归位,再画。带 turn_id 的按 id 找容器 —— 轮询可能从半截接上,那时
  // 屏幕上连这一轮的盒子都还没有,得现建;没有 turn_id 的是旧版记录,
  // 沿用老画法。
  if (ev.turn_id) turn = turnBox(ev.turn_id, ev.turn_no);
  else if (!turn) turn = newSection();

  if (ev.kind === "delta") {
    // 碎片没有 seq(见上面 LIVE 那段),那道去重拦不住它们 —— 这正是要的。
    streamDelta(ev);
    return;
  }

  if (ev.kind === "you") {
    // 用户那句话也是服务端发的一条事件,不再在提交时自己画 —— 否则重放
    // 出来的会是一串"没有问题的回答":那句问题从来没有进过事件流。
    // 每条 you 开启新一轮(它跟 tool_call/reply 共用 turn 这个游标)——
    // 这句只对旧版记录成立,新记录上面已经按 id 归好位了。
    if (!ev.turn_id) turn = newSection();
    call = null;
    add(el("div", "you", ev.text));
    refreshSessionsSoon();   // 这一轮开始了:侧栏那个点该亮起来

  } else if (ev.kind === "thinking") {
    const fresh = renderThinking(ev);
    if (!settleLive(ev.turn_id, "thinking", fresh)) add(fresh);

  } else if (ev.kind === "tool_call") {
    call = renderToolCall(ev.name, ev.input);
    add(call);

  } else if (ev.kind === "tool_result") {
    const d = document.createElement("details");
    d.className = "result";
    d.appendChild(el("summary", null, headline(ev.output) || "(没有输出)"));
    d.appendChild(el("pre", null, ev.output));
    add(d, call);
    call = null;

  } else if (ev.kind === "note") {
    add(el("div", "note", ("[" + ev.source + "] " + ev.text).trimEnd()));

  } else if (ev.kind === "ask") {
    add(renderAsk(ev));
    refreshSessionsSoon();   // 有人被挂住了,侧栏那个点要变蓝

  } else if (ev.kind === "reply") {
    const fresh = renderReply(ev.text);
    if (!settleLive(ev.turn_id, "text", fresh)) add(fresh);
    // 终态跟 reply 一起发过来(见 server.py 的 _run_turn)。标在轮号
    // 旁边 —— 不标的话,一轮跑完屏幕上那个"运行中"要等到下次刷新才变。
    if (ev.turn_id && ev.status) setState(ev.turn_id, ev.status);
    // 花费跟终态一起来,理由相同 —— 而且到这一刻这一轮的账才记完。
    // 刷新那一路由 renderTurn 补,两条路画的是同一行字符串。
    if (ev.turn_id && ev.usage) setUsage(ev.turn_id, ev.usage);
    // 保存失败:状态词已经由上面那句 setState 画成"未入库"了,这里补那句
    // 人话和复制按钮。判断用 ev.saved,不用 ev.status —— 后者是给页面看的
    // 显示值,前者才是"存没存上"这件事本身。
    if (ev.saved === false) add(saveFailureBox(ev));

  } else {
    // 认不出来的也显示,别默默吞掉 —— 将来加了新 kind,页面上至少
    // 看得出来,而不是凭空少一段。
    add(el("div", "note", JSON.stringify(ev)));
  }

  // 清空"正在流"的表,让下一片碎片另起一块。已经画上去的字留着不动 ——
  // 它们本来就是完整的。
  //
  // **thinking 和 reply 不在此列**,这一步是有讲究的:一轮的最后一次调用
  // 常常是"先来一个推理块、再来正文",推理那条完整事件先到。要是它也顺手
  // 清空,后面那条 reply 就找不到正文那块了,只好再画一个新的 —— 同一段话
  // 在屏幕上出现两遍。
  if (ev.kind !== "thinking" && ev.kind !== "reply") LIVE.clear();
}

// 以前一个 setBusy 把两件事捏在一起。多会话之后它们不再是一回事:另一个
// 会话在跑,当前这个照样能输入。
//
// setHeader 说的是"全部会话里有没有动静"(顶栏那个点),setComposer 说的是
// "当前这个会话能不能输入"。
function setHeader(anyRunning, anyWaiting) {
  head.classList.toggle("busy", anyRunning && !anyWaiting);
  head.classList.toggle("waiting", anyWaiting);
}

function setComposer(enabled) {
  box.disabled = !enabled;
  send.disabled = !enabled;
  hint.textContent = enabled ? "Enter 发送 · Shift+Enter 换行" : "运行中…";
  // 只在"从不可用变成可用"时抢焦点。轮询每 1.5 秒调一次这个函数,每次都
  // focus 的话,你正在页面上选中的文字每隔 1.5 秒就没了。
  if (enabled && composerOn === false) box.focus();
  composerOn = enabled;
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = box.value.trim();
  if (!query) return;

  // 还没有会话就现建一个。两次请求,比"让服务端在流里回一条 session 事件"
  // 直白 —— 那条协议只为这一处存在,却要先在流开头定义一个只出现过一次的
  // 事件类型。
  if (!current) {
    await newSession();
    if (!current) return;          // 建失败了,错误已经显示过
  }
  const sid = current;

  box.value = "";
  setComposer(false);
  // 人是自己按的发送:哪怕正翻在上面看旧账,也拉回底部看这条的回应。
  follow(true);

  // 必须发 application/json:这个 Content-Type 不在 CORS 的白名单里,
  // 浏览器因此必须先发预检。后端只对同机来源回 Allow-Origin,所以
  // 别的网页发来的请求会被浏览器掐在预检那一步,根本到不了后端。
  // 换成 text/plain 就退化成"简单请求",绕过预检直接开跑。
  let res;
  try {
    res = await fetch(API + "/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session: sid, query }),
    });
  } catch (err) {
    box.value = query;             // 送不出去就把话还回去,别让人白打一遍
    add(el("div", "error", backendHint(err)));
    setComposer(true);
    return;
  }

  if (!res.ok) {
    // 409 的含义跟以前不同了:以前是"有一轮在跑",现在是"**这个会话**有
    // 一轮在跑" —— 别的会话照跑不误。
    box.value = query;
    add(el("div", "error", "后端返回 " + res.status +
        (res.status === 409 ? "(这个会话上一轮还在跑)"
         : res.status === 404 ? "(这个会话不在了,新建一个再发)" : "")));
    setComposer(true);
    return;
  }

  // 逐块读,不 await res.text() —— 那样要等整轮跑完才拿到内容,
  // 就没有"看着它干活"这回事了。
  //
  // 用户那句话不在这儿画:服务端会发一条 you 事件过来(见 render)。自己
  // 先画一遍的话,重放时那句话说不出是从哪来的 —— 它从来没进过事件流。
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";
  ownsStream = true;

  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // 最后一段可能只到一半,留在 buf 里等下一块 —— 直接切会把一行
      // JSON 拦腰截断,JSON.parse 就炸了。
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (line.trim()) feed(sid, JSON.parse(line));
      }
    }
    if (buf.trim()) feed(sid, JSON.parse(buf));
  } catch (err) {
    // 不是错误,是"这一轮被从外面打断了" —— 最典型的就是后端重启(dev.py 改完
    // 代码重启、或者你手动停了服务)。所以是灰色旁注而不是红字。带上 err:这个
    // catch 也接着 JSON.parse 的 SyntaxError,把文本丢了就查不出是哪种。
    if (sid === current) {
      add(el("div", "note",
        "[连接] 这一轮读到一半连接断了(" + err + ")。正在等后端回来,回来了会自己接上"),
        stream);
    }
  }
  ownsStream = false;

  // 收尾:这一轮的事件可能没画全(中途切走过),补一下,顺带把 running 带回来。
  // 服务端是先放锁再关连接,所以读到 EOF 时问它,一般已经是 false —— 不会白转
  // 一个 1.5 秒的轮询。
  //
  // **走 pollTick 而不是直接 catchUp,就是这次修的东西**:后端刚重启时这一下
  // 也会问不着,而"问不着"不等于"这一轮结束了" —— 那一拍必须顺手把轮询接上,
  // 否则输入框永远停在"运行中…",只能手动刷新。加了 dev.py 之后这是最常见的
  // 触发点,不是边角:一轮干净跑完、收尾这一拍正好撞上重启。
  await pollTick();
  refreshSessions();
});

box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// 输入框跟着内容长高,最多到 CSS 里那个 max-height
box.addEventListener("input", () => {
  box.style.height = "auto";
  box.style.height = Math.min(box.scrollHeight, 200) + "px";
});

newBtn.addEventListener("click", newSession);

// fetch 在网络层失败时只给一句 "Failed to fetch",不说为什么 —— 后端没起、
// 预检被拒、端口写错,长得一模一样。所以把"试的是哪个地址"和"怎么办"
// 一起写出来,否则这句错误没法自助。
function backendHint(err) {
  return "连不上后端 " + (API || location.origin) + "。\n" +
    "  后端起了吗?在仓库目录跑:  .venv\\Scripts\\python.exe server.py\n" +
    "  起了的话,直接开 http://localhost:" + new URL(BACKEND).port +
    "/ —— 同源,不用跨域\n" +
    "  (" + err + ")";
}

// 开页面:拉列表 → 回到上次那个会话(没有就用最近动过的)→ 重放它。
async function boot() {
  let sessions;
  try {
    sessions = (await (await fetch(API + "/sessions")).json()).sessions;
  } catch (err) {
    add(el("div", "error", backendHint(err)));
    // 顶栏那个点也照实说。这里只点灯不发那条"[连接] …会自动接上"的旁注:这一步
    // 之后没有任何轮询在跑,真没人会去接 —— 那是句空话,而上面那段提示才是能照做
    // 的(把后端起起来,然后刷新)。
    head.classList.add("down");
    return;
  }
  SESSIONS = sessions;
  paintSessions();
  setHeader(sessions.some(s => s.running), sessions.some(s => s.waiting));

  // 当前会话记在 localStorage 里,不用 URL 的 hash:hash 会往浏览器历史里
  // 塞记录,切会话就变成了切页面,返回键的行为变得莫名其妙(要修得配
  // pushState)。hash 的好处是可分享、可收藏 —— 给自己用的工具,不值。
  const saved = localStorage.getItem("agent.session");
  const pick = sessions.find(s => s.id === saved) || sessions[0];
  if (pick) await switchTo(pick.id);
  else setComposer(true);   // 一个会话都没有:照常能打字,发第一条时现建
}

boot();
</script>
