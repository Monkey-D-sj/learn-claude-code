<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent</title>
<style>
  :root {
    --bg: #0d1117;
    --fg: #c9d1d9;
    --dim: #7d8590;
    --yellow: #e3b341;
    --line: #21262d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px 8px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #log > * { margin: 0 0 8px; }

  .tool_call { color: var(--yellow); }
  .note { color: var(--dim); font-size: 12px; }
  .reply { padding-top: 4px; }
  .error { color: #f85149; }

  details.tool_result {
    border-left: 2px solid var(--line);
    padding-left: 10px;
    color: var(--dim);
  }
  details.tool_result summary {
    cursor: pointer;
    color: var(--dim);
    list-style: none;
  }
  details.tool_result summary::-webkit-details-marker { display: none; }
  details.tool_result summary::before { content: "▸ "; }
  details.tool_result[open] summary::before { content: "▾ "; }
  details.tool_result pre {
    margin: 6px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--dim);
  }

  #bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px 16px;
    border-top: 1px solid var(--line);
  }
  #q {
    flex: 1;
    resize: none;
    height: 42px;
    padding: 10px 12px;
    background: #161b22;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
  }
  #q:focus { outline: none; border-color: #30363d; }
  #q:disabled { opacity: .5; }
  #send {
    padding: 0 18px;
    background: #21262d;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    font: inherit;
    cursor: pointer;
  }
  #send:disabled { opacity: .4; cursor: default; }
</style>
</head>
<body>

<div id="log"></div>

<form id="bar">
  <textarea id="q" rows="1" placeholder="问点什么…  (Enter 发送,Shift+Enter 换行)" autofocus></textarea>
  <button id="send" type="submit">发送</button>
</form>

<script>
const log = document.getElementById("log");
const form = document.getElementById("bar");
const box = document.getElementById("q");
const send = document.getElementById("send");

function el(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

function add(node) {
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
}

function render(ev) {
  if (ev.kind === "tool_call") {
    add(el("div", "tool_call", "$ " + ev.name + " " + JSON.stringify(ev.input)));

  } else if (ev.kind === "tool_result") {
    // 默认收起。summary 上放开头两行,扫一眼就知道回了什么,要细看再展开。
    const head = ev.output.trim().split("\n").slice(0, 2).join(" / ").slice(0, 140);
    const d = document.createElement("details");
    d.className = "tool_result";
    d.appendChild(el("summary", null, ev.name + ": " + (head || "(没有输出)")));
    d.appendChild(el("pre", null, ev.output));
    add(d);

  } else if (ev.kind === "note") {
    add(el("div", "note", ("[" + ev.source + "] " + ev.text).trimEnd()));

  } else if (ev.kind === "reply") {
    add(el("div", "reply", ev.text));

  } else {
    // 认不出来的事件也显示,别默默吞掉 —— 将来加了新 kind,页面上
    // 至少看得出来,而不是凭空少了一段。
    add(el("div", "note", JSON.stringify(ev)));
  }
}

function setBusy(busy) {
  box.disabled = busy;
  send.disabled = busy;
  if (!busy) box.focus();
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const query = box.value.trim();
  if (!query) return;

  add(el("div", "tool_call", "> " + query));
  box.value = "";
  setBusy(true);

  let res;
  try {
    res = await fetch("/ask", { method: "POST", body: query });
  } catch (err) {
    add(el("div", "error", "连不上后端: " + err));
    setBusy(false);
    return;
  }

  if (!res.ok) {
    add(el("div", "error", "后端返回 " + res.status +
        (res.status === 409 ? "(上一轮还在跑)" : "")));
    setBusy(false);
    return;
  }

  // 逐块读,不 await res.text() —— 那样要等整轮跑完才拿到内容,
  // 就没有"看着它干活"这回事了。
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buf = "";

  try {
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      // 最后一段可能只到一半,留在 buf 里等下一块 —— 直接切会把一行
      // JSON 拦腰截断,JSON.parse 就炸了。
      const lines = buf.split("\n");
      buf = lines.pop();
      for (const line of lines) {
        if (line.trim()) render(JSON.parse(line));
      }
    }
    if (buf.trim()) render(JSON.parse(buf));
  } catch (err) {
    add(el("div", "error", "流断了: " + err));
  }

  setBusy(false);
});

box.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});
</script>

</body>
</html>
